<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1b19">
<title>Hervor</title>
<style>
:root{--carbon:#1e1b19;--cobre:#e0904e;--crema:#f3e7d3;--vapor:#9fb4c2;--polvo:#b3a58f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--carbon);overflow:hidden;overscroll-behavior:none}
body{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;color:var(--crema);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;color:inherit;touch-action:none}
.panel{background:rgba(30,27,25,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(243,231,211,.12);border-radius:16px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
#top{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;padding:6px 10px;z-index:5}
#top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
#rName{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rState{font:12px system-ui,sans-serif;color:var(--vapor)}
#top .clk{text-align:right;font:700 18px system-ui,sans-serif;font-variant-numeric:tabular-nums}
#top .clk small{display:block;font:12px system-ui,sans-serif;color:var(--polvo)}
.rb{width:38px;height:38px;border-radius:50%;border:1px solid rgba(243,231,211,.14);background:transparent;display:grid;place-items:center;padding:0}
#stepbar{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 58px);padding:8px 12px;z-index:5}
#stepNow{font-size:16px;font-weight:700;line-height:1.25}
#stepProg{font:12px system-ui,sans-serif;color:var(--cobre);margin-top:2px;min-height:15px}
#stepNext{font:12px system-ui,sans-serif;color:var(--polvo);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shelf{position:fixed;left:0;right:0;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 108px);display:flex;gap:8px;overflow-x:auto;padding:8px max(10px,env(safe-area-inset-left)) 4px;z-index:5;scrollbar-width:none;touch-action:pan-x}
#shelf::-webkit-scrollbar{display:none}
.ing{flex:0 0 auto;width:64px;height:68px;border-radius:14px;border:1px solid rgba(243,231,211,.14);background:rgba(30,27,25,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;position:relative;padding:0;touch-action:pan-x}
.ing canvas{width:40px;height:40px;image-rendering:pixelated}
.ing.cur{border-color:var(--cobre);box-shadow:0 0 0 2px rgba(224,144,78,.35)}
.ing.shake{animation:sh .3s}
@keyframes sh{20%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.ing .bd{position:absolute;top:-6px;right:-4px;background:var(--cobre);color:var(--carbon);font:700 11px system-ui,sans-serif;border-radius:9px;padding:1px 6px}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(96vw,460px);padding:6px;z-index:5;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.fire{flex:1;height:44px;border-radius:12px;border:1px solid rgba(243,231,211,.14);background:transparent;font:600 13px system-ui,sans-serif}
.fire.on{background:var(--cobre);color:var(--carbon);border-color:var(--cobre)}
.tb{flex:1;height:44px;border-radius:12px;border:0;background:rgba(243,231,211,.07);display:flex;align-items:center;justify-content:center;gap:5px;font:600 12px system-ui,sans-serif}
.tb.on{background:var(--crema);color:var(--carbon)}
.tb.pulse{animation:pu 1s infinite}
@keyframes pu{50%{box-shadow:0 0 0 4px rgba(224,144,78,.55)}}
#toast{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 150px);transform:translateX(-50%);background:rgba(30,27,25,.92);padding:9px 14px;border-radius:12px;font:14px/1.35 system-ui,sans-serif;max-width:86vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column}
#menu{background:var(--carbon);padding:max(28px,env(safe-area-inset-top)) 20px 20px;overflow-y:auto;touch-action:pan-y}
#menu h1{font-size:clamp(52px,16vw,96px);margin:2vh 0 0;line-height:.95;font-weight:700;letter-spacing:-.03em}
#menu .tag{font-style:italic;color:#cdb99b;font-size:19px;margin:6px 0 16px}
.opt{align-self:flex-start;font:13px system-ui,sans-serif;background:none;border:1px solid rgba(243,231,211,.2);border-radius:999px;padding:8px 14px;margin-bottom:14px;touch-action:manipulation}
.opt b{color:var(--cobre)}
.rc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(243,231,211,.06);margin-bottom:8px;border:0;width:100%;text-align:left;touch-action:manipulation}
.rc .n{width:34px;height:34px;border-radius:50%;border:1px solid rgba(243,231,211,.25);display:grid;place-items:center;font:700 14px system-ui,sans-serif;flex:none}
.rc .t{flex:1;min-width:0}
.rc .t b{display:block;font-size:17px}
.rc .t span{font:12px system-ui,sans-serif;color:var(--polvo)}
.rc .s{font:15px system-ui,sans-serif;color:var(--cobre);letter-spacing:1px;flex:none}
.rc.lock{opacity:.4;pointer-events:none}
#card,#res{background:rgba(15,12,10,.7);align-items:center;justify-content:center}
.paper{background:#f1e6d0;color:#2a1f16;width:min(90vw,360px);max-height:88vh;overflow:auto;padding:18px;border-radius:6px;box-shadow:0 14px 50px rgba(0,0,0,.55);animation:rise .4s ease-out;touch-action:pan-y}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.paper,.tb.pulse,.ing.shake{animation:none}}
.paper h2{margin:0 0 4px;font-size:24px;font-style:italic}
.paper .sub{font:13px system-ui,sans-serif;color:#6b5a42;margin-bottom:12px}
.paper ol{margin:0 0 14px;padding-left:22px;font:14px/1.45 system-ui,sans-serif}
.paper li.done{color:#8a7d68;text-decoration:line-through}
.paper li.cur{font-weight:700;color:#a8541a}
.go{width:100%;font:700 16px system-ui,sans-serif;background:var(--cobre);color:var(--carbon);border:0;border-radius:999px;padding:13px 20px;margin-top:6px;touch-action:manipulation}
.go.sec{background:transparent;color:#2a1f16;border:1px solid rgba(42,31,22,.3)}
.stars{font-size:34px;color:#c9701f;letter-spacing:4px;text-align:center;margin:6px 0 10px}
.mist{font:14px/1.6 system-ui,sans-serif;margin-bottom:12px}
.mist div{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(42,31,22,.25)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="panel">
  <button class="rb" id="bMenu" aria-label="Menú"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="ttl"><span id="rName">Hervor</span><span id="rState">Frío</span></div>
  <div class="clk"><span id="clock">0:00</span><small id="temp">20°</small></div>
</div>

<div id="stepbar" class="panel hidden">
  <div id="stepNow"></div><div id="stepProg"></div><div id="stepNext"></div>
</div>
<div id="toast"></div>

<div id="dock" class="panel hidden">
  <div class="row">
    <button class="tb on" id="tSpoon"><svg class="i" viewBox="0 0 24 24"><ellipse cx="9" cy="9" rx="4" ry="5.5"/><path d="M12 13l8 8"/></svg>Cuchara</button>
    <button class="tb" id="tSkim"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="5.5"/><path d="M7 8h.01M10 7h.01M9 11h.01M12 10h.01M13 13l7 7"/></svg>Espumar</button>
    <button class="tb" id="bSpeed">×1</button>
    <button class="tb" id="bHome" aria-label="Volver a la olla"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg></button>
    <button class="tb" id="bRecipe" aria-label="Receta"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg></button>
  </div>
</div>

<div id="menu" class="ov">
  <h1>Hervor</h1>
  <div class="tag">Cocina lenta, con el oído atento</div>
  <a href="index.html" style="color:#c9b48c;font:13px system-ui,sans-serif;text-decoration:underline;display:inline-block;margin:0 0 14px">&larr; Volver al inicio</a>
  <button class="opt" id="bShow">Pasos en pantalla: <b id="showV">sí</b></button>
  <div id="list"></div>
</div>

<div id="card" class="ov hidden"><div class="paper" id="cardIn"></div></div>
<div id="res" class="ov hidden"><div class="paper" id="resIn"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('#c'),ctx=cv.getContext('2d');
const CAP=12,QS=[0,30,60,100],LOSS100=20;
let dpr=1,VW=0,VH=0,bg=null;const pot={cx:0,cy:0,R:100};

/* ================= INGREDIENTES ================= */
const ING={
 agua:{n:'Agua',kind:'liq',col:[111,180,234]},
 leche:{n:'Leche',kind:'liq',col:[246,243,234]},
 tomate:{n:'Tomate',kind:'liq',col:[204,58,43]},
 aceite:{n:'Aceite',kind:'liq',col:[233,191,51],oil:1},
 sal:{n:'Sal',kind:'pow',col:'#f2f2ee',unit:'pizcas',u1:'pizca'},
 azucar:{n:'Azúcar',kind:'pow',col:'#f7f0e0',unit:'cucharadas',u1:'cucharada'},
 harina:{n:'Harina de maíz',short:'Maíz',kind:'pow',col:'#e8c860',unit:'puñados',u1:'puñado',needStir:1},
 bicarbonato:{n:'Bicarbonato',short:'Bicarb.',kind:'pow',col:'#e3e6e8',unit:'pizcas',u1:'pizca'},
 huevo:{n:'Huevo',kind:'sol',v:1},fideos:{n:'Fideos',kind:'sol',noodle:14},arroz:{n:'Arroz',kind:'sol',seed:26},
 cebolla:{n:'Cebolla',kind:'sol',v:4,h:1},zapallo:{n:'Zapallo',kind:'sol',v:4,h:1},papa:{n:'Papa',kind:'sol',v:3,h:1},
 queso:{n:'Queso',kind:'sol',v:3,h:1},morron:{n:'Morrón',kind:'sol',v:4,h:1},panceta:{n:'Panceta',kind:'sol',v:3,h:1},
 lentejas:{n:'Lentejas',kind:'sol',seed:16},laurel:{n:'Laurel',kind:'sol',v:1,h:1},ajo:{n:'Ajo',kind:'sol',v:3,h:1},
 albahaca:{n:'Albahaca',kind:'sol',v:3,h:1},carne:{n:'Carne',kind:'sol',v:3,h:1},zanahoria:{n:'Zanahoria',kind:'sol',v:4,h:1},
 choclo:{n:'Choclo',kind:'sol',v:2,h:1},naranja:{n:'Naranja',kind:'sol',v:2,h:1},limon:{n:'Limón',kind:'sol',v:2,h:1}
};
// Si existe tiles/<id>.png (el tileset), se usa en lugar del dibujo provisorio.
const TINT={zapallo:[236,143,44],carne:[168,72,58],cebolla:[217,163,196],zanahoria:[240,138,42],morron:[210,59,42],papa:[216,185,130],lentejas:[154,106,58],choclo:[242,203,58],naranja:[245,154,35],limon:[242,224,74],panceta:[232,162,160]};
const IMG={};
Object.keys(ING).forEach(id=>['','_s'].forEach(suf=>{const im=new Image();im.onload=()=>{IMG[id+suf]=im;delete SPR[id+suf];for(const k in VAR)if(k.startsWith(id+'|'))delete VAR[k];rebuildBgSoon();};im.src='tiles/'+id+suf+'.png';}));

function drawIngVec(g,id,x,y,s,rot){
  g.save();g.translate(x,y);g.rotate(rot||0);
  const r=s/2,d=ING[id],lw=Math.max(1,s*.06);
  const E=(x,y,rx,ry,f,st)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=f;g.fill();if(st){g.strokeStyle=st;g.lineWidth=lw;g.stroke();}};
  const P=(f,st)=>{g.fillStyle=f;g.fill();if(st){g.strokeStyle=st;g.lineWidth=lw;g.stroke();}};
  if(d.kind==='liq'){
    const c='rgb('+d.col.join(',')+')';g.beginPath();g.moveTo(0,-r*.9);g.quadraticCurveTo(r*.9,r*.1,0,r*.9);g.quadraticCurveTo(-r*.9,r*.1,0,-r*.9);P(c,'rgba(0,0,0,.25)');
    g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(-r*.25,0,r*.12,r*.28,0.3,0,TAU);g.fill();g.restore();return;
  }
  if(d.kind==='pow'){
    for(let i=0;i<9;i++){const a=i*2.4,rr=r*.55*Math.sqrt((i+1)/9);E(Math.cos(a)*rr,r*.2+Math.sin(a)*rr*.5-(i>5?r*.15:0),r*.2,r*.2,d.col,'rgba(0,0,0,.2)');}
    g.restore();return;
  }
  switch(id){
   case 'huevo':E(0,0,r*.72,r*.92,'#f1e3c8','#c4ae84');E(-r*.2,-r*.3,r*.14,r*.2,'rgba(255,255,255,.6)');break;
   case 'fideos':g.strokeStyle='#e6c56a';g.lineWidth=s*.12;g.lineCap='round';for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(-r*.8,i*r*.45);g.bezierCurveTo(-r*.3,i*r*.45-r*.4,r*.3,i*r*.45+r*.4,r*.8,i*r*.45);g.stroke();}break;
   case 'arroz':for(let i=0;i<6;i++){const a=i*1.05;g.save();g.rotate(a);E(r*.45,0,r*.24,r*.1,'#fbf8ee','#d8d2bc');g.restore();}break;
   case 'cebolla':E(0,0,r*.85,r*.8,'#d9a3c4','#a56a8f');g.strokeStyle='#b97aa0';g.lineWidth=lw*.8;for(let k=.3;k<.8;k+=.25){g.beginPath();g.ellipse(0,0,r*k,r*k*.95,0,0,TAU);g.stroke();}break;
   case 'zapallo':g.beginPath();g.rect(-r*.7,-r*.7,r*1.4,r*1.4);P('#ec8f2c','#b9691c');g.fillStyle='rgba(255,255,255,.2)';g.fillRect(-r*.7,-r*.7,r*1.4,r*.3);break;
   case 'papa':E(0,0,r*.85,r*.65,'#d8b982','#a98a55');for(let i=0;i<4;i++)E(Math.cos(i*1.7)*r*.4,Math.sin(i*2.3)*r*.3,r*.07,r*.07,'#a88a58');break;
   case 'queso':g.beginPath();g.moveTo(-r*.8,r*.5);g.lineTo(r*.8,r*.5);g.lineTo(r*.8,-r*.1);g.closePath();P('#f3cf4a','#c49a1c');E(r*.3,r*.25,r*.1,r*.1,'#c49a1c');E(-r*.3,r*.3,r*.07,r*.07,'#c49a1c');break;
   case 'morron':E(0,r*.1,r*.7,r*.75,'#d23b2a','#972217');g.fillStyle='#4f8a3a';g.fillRect(-r*.08,-r*.8,r*.16,r*.3);break;
   case 'panceta':g.beginPath();g.rect(-r*.8,-r*.45,r*1.6,r*.9);P('#e8a2a0','#b56a68');g.fillStyle='#f6dcd6';g.fillRect(-r*.8,-r*.12,r*1.6,r*.2);break;
   case 'lentejas':for(let i=0;i<6;i++)E(Math.cos(i*1.9)*r*.5,Math.sin(i*1.9)*r*.5,r*.2,r*.2,'#9a6a3a','#6b4624');break;
   case 'laurel':g.beginPath();g.moveTo(-r*.85,0);g.quadraticCurveTo(0,-r*.7,r*.85,0);g.quadraticCurveTo(0,r*.7,-r*.85,0);P('#5f8f3f','#3d6228');g.strokeStyle='#3d6228';g.beginPath();g.moveTo(-r*.8,0);g.lineTo(r*.8,0);g.stroke();break;
   case 'ajo':E(0,r*.15,r*.65,r*.6,'#f0ead8','#c9bfa0');g.beginPath();g.moveTo(-r*.15,-r*.3);g.lineTo(0,-r*.85);g.lineTo(r*.15,-r*.3);P('#f0ead8','#c9bfa0');break;
   case 'albahaca':g.save();g.rotate(-.5);E(-r*.2,0,r*.5,r*.28,'#3f9a45','#276a2c');g.restore();g.save();g.rotate(.6);E(r*.2,0,r*.5,r*.28,'#4fae55','#276a2c');g.restore();break;
   case 'carne':g.beginPath();g.rect(-r*.8,-r*.6,r*1.6,r*1.2);P('#a8483a','#6f2a20');g.strokeStyle='#e8a898';g.lineWidth=lw;g.beginPath();g.moveTo(-r*.5,-r*.2);g.lineTo(r*.2,-r*.3);g.moveTo(-r*.3,r*.2);g.lineTo(r*.5,r*.1);g.stroke();break;
   case 'zanahoria':g.beginPath();g.moveTo(-r*.9,-r*.2);g.lineTo(r*.9,0);g.lineTo(-r*.9,r*.2);g.closePath();P('#f08a2a','#b9601a');g.fillStyle='#4f9a3a';g.fillRect(-r*1.0,-r*.2,r*.2,r*.4);break;
   case 'choclo':E(0,0,r*.9,r*.5,'#f2cb3a','#b98f12');for(let i=-3;i<=3;i++)for(let j=-1;j<=1;j+=2)E(i*r*.24,j*r*.18,r*.07,r*.07,'#d9a91f');break;
   case 'naranja':E(0,0,r*.85,r*.85,'#f59a23','#b86a0e');g.strokeStyle='#fbc878';g.lineWidth=lw*.8;for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(i*.8)*r*.7,Math.sin(i*.8)*r*.7);g.stroke();}break;
   case 'limon':E(0,0,r*.9,r*.6,'#f2e04a','#b9a418');E(-r*.95,0,r*.1,r*.1,'#b9a418');E(r*.95,0,r*.1,r*.1,'#b9a418');break;
   default:E(0,0,r*.7,r*.7,'#ccc','#888');
  }
  g.restore();
}

/* ================= RECETAS ================= */
const RECIPES=[
 {id:'huevos',name:'Huevos duros',desc:'Agua fría, huevos y paciencia.',steps:[
  {t:'add',ing:'agua',n:6},{t:'add',ing:'huevo',n:4},{t:'heat',to:'boil'},{t:'cook',ph:'simmer',min:10},{t:'off'}]},
 {id:'fideos',name:'Fideos',desc:'Hervor fuerte, pero sin que se derrame.',steps:[
  {t:'add',ing:'agua',n:7},{t:'add',ing:'sal',n:2},{t:'heat',to:'boil'},{t:'add',ing:'fideos',n:3},{t:'stir',n:2,within:1},{t:'cook',ph:'boil',min:8},{t:'off'}]},
 {id:'arroz',name:'Arroz',desc:'Sofreír, agua, fuego mínimo y no tocar.',steps:[
  {t:'add',ing:'aceite',n:1},{t:'heat',to:'hot'},{t:'add',ing:'arroz',n:3},{t:'cook',ph:'sizzle',min:2,stir:3},
  {t:'add',ing:'agua',n:5},{t:'add',ing:'sal',n:1},{t:'heat',to:'boil'},{t:'cook',ph:'simmer',min:14,nostir:1},{t:'off'}]},
 {id:'zapallo',name:'Crema de zapallo',desc:'Un sofrito, verduras y un buen rato a fuego suave.',steps:[
  {t:'add',ing:'aceite',n:1},{t:'heat',to:'hot'},{t:'add',ing:'cebolla',n:2},{t:'cook',ph:'sizzle',min:2,stir:3},
  {t:'add',ing:'zapallo',n:3},{t:'add',ing:'papa',n:2},{t:'add',ing:'agua',n:5},{t:'add',ing:'sal',n:1},
  {t:'heat',to:'boil'},{t:'cook',ph:'simmer',min:18,stir:2},{t:'stir',n:4,within:2},{t:'off'}]},
 {id:'polenta',name:'Polenta',desc:'La harina en lluvia, mientras se revuelve sin parar.',sticky:1,steps:[
  {t:'add',ing:'agua',n:6},{t:'add',ing:'sal',n:1},{t:'heat',to:'boil'},{t:'add',ing:'harina',n:6},
  {t:'cook',ph:'simmer',min:12,stir:6},{t:'add',ing:'queso',n:1},{t:'stir',n:1,within:1.5},{t:'off'}]},
 {id:'lentejas',name:'Guiso de lentejas',desc:'Sofrito completo, cocción larga. La sal va al final.',steps:[
  {t:'add',ing:'aceite',n:1},{t:'heat',to:'hot'},{t:'add',ing:'cebolla',n:1},{t:'add',ing:'morron',n:1},{t:'add',ing:'panceta',n:1},
  {t:'cook',ph:'sizzle',min:2,stir:2},{t:'add',ing:'lentejas',n:3},{t:'add',ing:'agua',n:6},{t:'add',ing:'laurel',n:1},

function layout(){

    if(b.tiny)continue;const kf=clamp(b.age/b.life,0,1),dmax=Math.max(1,Math.round(b.r*K*2*Math.min(1,sf))),d=Math.max(1,Math.round(dmax*(.35+.65*kf)));
    const p=rel(b.x,b.y),bx=Math.round(p[0]-d/2),by=Math.round(p[1]-d/2),pts=ringPts(d);
    for(const[px,py]of pts)putM(bx+px,by+py,pk(235,245,255),.8);
    if(d>=4)put(bx+1,by+1,pk(255,255,255));else if(d===3)putM(bx,by+1,pk(255,255,255),1);
    if(d>=5){for(let j=1;j<d-1;j++)for(let i=1;i<d-1;i++){if(Math.hypot(i-(d-1)/2,j-(d-1)/2)<d/2-1.2&&((i+j)&1))putM(bx+i,by+j,pk(255,255,255),.12);}}
  }
  // ondas
  for(const rg of S.rings){const rr=Math.max(1,Math.round(rg.r*K*sf)),p=rel(rg.x-pot.cx,rg.y-pot.cy),a=clamp(rg.a,0,1)*.9;
    const n=Math.max(8,rr*6);for(let q=0;q<n;q++){const an=q/n*TAU,px=p[0]+Math.cos(an)*rr,py=p[1]+Math.sin(an)*rr;if(cl(px,py))putD(px,py,pk(240,248,255),a);}}

  // ===== superficie: reflejo de la lámpara =====
  if(hasLiq){
    const amp=Math.min(1.6,Math.abs(S.swirl)*.12+(S.boil?S.boilB*1.2+.4:({burbujas:.3,casi:.6,sizzle:.7,smoke:.7}[S.phase]||0)));
    const hx=scx-rs*.3,hy=scy-rs*.32,A=rs*.36,Bv=rs*.13,ca=Math.cos(-.62),sa=Math.sin(-.62);
    for(let y=Math.floor(hy-A);y<=Math.ceil(hy+A);y++)for(let x=Math.floor(hx-A);x<=Math.ceil(hx+A);x++){
      if(!cl(x,y))continue;
      const sh=Math.round(Math.sin(x*.8+y*.5+tick*.9)*amp),sx=x+sh-hx,sy=y-hy,u=(sx*ca+sy*sa)/A,v=(-sx*sa+sy*ca)/Bv,e=u*u+v*v;
      if(e<=1)putM(x,y,pk(255,246,222),e<.35?.62:.3);
    }
    const wxp=scx+rs*.36,wyp=scy+rs*.4;for(let y=-1;y<=1;y++)for(let x=-3;x<=3;x++){const px=wxp+x,py=wyp+y;if(cl(px,py))putM(px,py,pk(255,246,222),(Math.abs(x)<3&&y===0)?.4:.2);}
    const act=S.boil?S.boilB+.35:(S.phase==='sizzle'||S.phase==='smoke'?.8:(S.phase==='casi'?.25:0));
    if(act>0){const n=Math.round(act*6);for(let q=0;q<n;q++){const h1=hs(q*7+tick,tick*3+q),h2=hs(q*13+tick*2,q+tick),an=h1*TAU,rr=Math.sqrt(h2)*rs*.92;if((tick+q)%3<2)put(scx+Math.cos(an)*rr,scy+Math.sin(an)*rr,pk(255,255,250));}}
  }
  // ===== perilla =====
  {const kx=knobW.x-camL,ky=knobW.y,kr=knobW.r,ka=knobAng*Math.PI/180;
    for(let y=ky-kr;y<=ky+kr;y++)for(let x=kx-kr;x<=kx+kr;x++){const dx=x-kx,dy=y-ky,d=Math.hypot(dx,dy);if(d>kr)continue;
      const lit=(dx*-.7071+dy*-.7071)/(kr||1);let c=d>kr-1?pk(26,28,31):steelTone(.55+.3*lit-.1*(d/kr),x,y);put(x,y,c);}
    for(let t=0;t<=kr-1;t+=.5)put(kx+Math.cos(ka)*t,ky+Math.sin(ka)*t,t>kr-3?pk(255,150,70):pk(30,32,36));
    put(kx+Math.cos(ka)*(kr-1),ky+Math.sin(ka)*(kr-1),pk(255,200,120));
    const nm=['APAGADO','BAJO','MEDIO','ALTO'][S.burner],tw=nm.length*4-1;
    textPx(put,nm,kx-Math.floor(tw/2)+1,ky+kr+4,pk(8,8,10));textPx(put,nm,kx-Math.floor(tw/2),ky+kr+3,S.burner?pk(255,196,120):pk(170,175,180));}
  // ===== fuera de la olla =====
  if(S.pour&&!S.pour.done){const d=ING[S.pour.id];if(d.kind==='liq'){const c1=d.oil?pk(240,200,60):pk(190,222,252),c2=d.oil?pk(205,165,40):pk(140,185,230);
    for(let y=0;y<scy-rs*.1;y++){const c=((y+tick)&3)<2?c1:c2;put(cxl,y,c);put(cxl+1,y,c);}}}
  for(const dr of S.drops){const x=wx(dr.x),y=wy(dr.y-dr.z*.5),c=colOf(dr.col);put(x,y,c);if(dr.r>2)put(x+1,y,c);}
  for(const s of S.steam){const k2=1-s.age/s.life,rl=Math.max(2,s.r*K);disc(wx(s.x),wy(s.y),rl,(x,y,t)=>{putD(x,y,pk(222,232,240),s.a*k2*3.2*(1-t));});}
  for(const s of S.smoke){const k2=1-s.age/s.life,rl=Math.max(2,s.r*K);disc(wx(s.x),wy(s.y),rl,(x,y,t)=>{putD(x,y,pk(52,46,42),s.a*k2*3.2*(1-t));});}
  if(S.prompt){const seg=24,rr=rs*.7;for(let q=0;q<seg*3;q++){const an=q/(seg*3)*TAU;if(((Math.floor((an+tick*.12)/(TAU/seg)))&1)===0)put(scx+Math.cos(an)*rr,scy+Math.sin(an)*rr,(tick&2)?pk(255,176,96):pk(224,144,78));}
    const a=tick*.22;for(let q=0;q<3;q++)put(scx+Math.cos(a-q*.12)*(rr+q-1),scy+Math.sin(a-q*.12)*(rr+q-1),pk(255,200,130));}
  // nivel
  {const gx=Math.round(cxl-r*1.3-7),gh=Math.round(r*1.2),gy=Math.round(cyl-gh/2),lv=clamp(fill()/CAP,0,1),fh=Math.round(gh*lv);
    for(let y=0;y<gh;y++)for(let x=0;x<3;x++)put(gx+x,gy+y,pk(14,15,17));
    for(let y=gh-fh;y<gh;y++)for(let x=0;x<3;x++)put(gx+x,gy+y,S.rise>.4?pk(240,195,106):pk(127,183,230));
    for(let q=0;q<=4;q++){const y=gy+Math.round(gh*q/4);put(gx-2,y,pk(190,195,200));put(gx-1,y,pk(190,195,200));}}
  // frasco que se pide ahora: resaltado, flecha y cantidad
  const cj=curJar();
  for(const j of jars){
    const sx=j.x-camL;if(sx<-14||sx>LW+14)continue;
    if(j.flash>0){const c=pk(255,90,70);for(let x=-11;x<=11;x++){put(sx+x,j.y-25,c);put(sx+x,j.y+9,c);}for(let y=-25;y<=9;y++){put(sx-11,j.y+y,c);put(sx+11,j.y+y,c);}}
    if(S.pour&&S.pour.id===j.id){const c=pk(255,214,150);for(let x=-11;x<=11;x++)put(sx+x,j.y-25,c);}
  }
  if(cj&&showSteps){
    const sx=cj.x-camL,bob=(tick%6<3)?0:1,c=(tick&2)?pk(255,176,96):pk(224,144,78);
    if(sx>-12&&sx<LW+12){
      for(let x=-11;x<=11;x++){if(((x+tick)&3)<2){put(sx+x,cj.y-25,c);put(sx+x,cj.y+9,c);}}
      for(let y=-25;y<=9;y++){if(((y+tick)&3)<2){put(sx-11,cj.y+y,c);put(sx+11,cj.y+y,c);}}
      for(let k=0;k<4;k++)for(let x=-3+k;x<=3-k;x++)put(sx-7+x,cj.y-31+k+bob,c);
      const st=R.steps[si],rem=Math.max(0,Math.ceil(st.n-(S.inPot[st.ing]||0)-0.001)),tx='X'+rem,tw=tx.length*4-1;
      for(let y=-1;y<=5;y++)for(let x=-1;x<=tw;x++)put(sx+1+x,cj.y-33+y,pk(20,18,16));
      textPx(put,tx,sx+1,cj.y-33,pk(255,196,120));
    }else{
      const side=sx<0?-1:1,ax=side<0?3:LW-4,ay=clamp(cj.y,40,LH-40);
      for(let k=0;k<5;k++){const o=side<0?k:-k;put(ax+o,ay-4+k,c);put(ax+o,ay+4-k,c);put(ax+o+(side<0?1:-1),ay-4+k,c);put(ax+o+(side<0?1:-1),ay+4-k,c);}
    }
  }
  // herramienta
  if(S.spoon.vis>.05){
    const sx=wx(S.spoon.x),sy=wy(S.spoon.y),dx=Math.sin(.7),dy=Math.cos(.7),len=r*1.3;
    if(tool==='spoon'){
      for(let t=0;t<=len;t+=.5){const px=sx+dx*(t+r*.15),py=sy+dy*(t+r*.15);put(px+1,py+1,pk(20,20,22));put(px,py,pk(185,138,79));put(px+1,py,pk(138,99,52));}

        const ux=x-sx,uy=y-sy,lx=ux*ca2+uy*sa2,ly=-ux*sa2+uy*ca2,e=(lx*lx)/(hrx*hrx)+(ly*ly)/(hry*hry);
        if(e<=1)put(x,y,e>.7?pk(138,99,52):pk(201,154,94));}
    }else{
      for(let t=0;t<=len;t+=.5){const px=sx+dx*(t+r*.17),py=sy+dy*(t+r*.17);put(px+1,py+1,pk(20,20,22));put(px,py,pk(140,148,155));}
      disc(sx,sy,r*.17,(x,y,t)=>{put(x,y,t>.82?pk(107,115,122):((Math.round(x+y)&3)===0&&t<.7?pk(75,81,87):pk(211,217,222)));});
    }
  }
  lctx.putImageData(limg,0,0);
  g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;
  g.drawImage(lcv,0,0,LW,LH,0,0,LW*PS,LH*PS);
}

const ptrs=new Map();let drag=null,toastedPan=false;
const toWorldCss=x=>x+camL/K;
function knobLevelFrom(wl,hl){
  const dx=wl-knobW.x,dy=hl-knobW.y;let l=0;
  if(dy>0)l=dx<0?0:3;
  else{const a=Math.atan2(dy,dx)*180/Math.PI;let best=1e9;for(let i=0;i<4;i++){const da=Math.abs(a-DET[i]);if(da<best){best=da;l=i;}}}
  if(l!==S.burner)setFire(l);
}
function arrowTarget(cx,cy){
  const j=curJar();if(!j||!showSteps)return null;const sx=j.x-camL;if(sx>-12&&sx<LW+12)return null;
  const side=sx<0?-1:1;if(side<0?cx>60:cx<VW-60)return null;if(Math.abs(cy-j.y/K)>80)return null;
  return clamp(j.x-LW/2,0,cam.max);
}
cv.addEventListener('pointerdown',e=>{
  Snd.init();
  const wl=e.clientX*K+camL,hl=e.clientY*K,play=(mode==='play'&&!paused&&!S.done);
  let st=null;
  if(play){
    if(Math.hypot(wl-knobW.x,hl-knobW.y)<=knobW.r+11){st={kind:'knob'};knobLevelFrom(wl,hl);}
    else{
      const j=jars.find(j=>wl>=j.x-11&&wl<=j.x+11&&hl>=j.y-25&&hl<=j.y+10);
      if(j){
        st={kind:'jar',j,x0:e.clientX,y0:e.clientY,moved:false,started:false,timer:0};
        // los líquidos y polvos se vierten al mantener apretado; si el dedo se desliza antes, es un arrastre de cámara
        if(ING[j.id].kind!=='sol')st.timer=setTimeout(()=>{if(!st.moved&&ptrs.get(e.pointerId)===st){st.started=true;startAdd(j.id);}},170);
      }else if(Math.hypot(wl-potW.x,hl-potW.y)<=potW.r*1.02&&!drag){
        const x=toWorldCss(e.clientX);
        drag={id:e.pointerId,a:Math.atan2(e.clientY-pot.cy,x-pot.cx),t:performance.now(),t0:performance.now(),moved:0,lx:x,ly:e.clientY,q:0};
        S.spoon.on=true;S.spoon.x=x;S.spoon.y=e.clientY;S.swirlT=0;st={kind:'stir'};
      }
    }
  }
  if(!st){
    const tg=arrowTarget(e.clientX,e.clientY);if(tg!=null){cam.tx=tg;cam.v=0;return;}
    st={kind:'pan',lx:e.clientX,lt:performance.now()};cam.v=0;cam.tx=null;
  }
  ptrs.set(e.pointerId,st);try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  const st=ptrs.get(e.pointerId);if(!st)return;
  if(st.kind==='knob'){knobLevelFrom(e.clientX*K+camL,e.clientY*K);return;}
  if(st.kind==='jar'){
    if(!st.started&&!st.moved&&Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>8){st.moved=true;clearTimeout(st.timer);st.kind='pan';st.lx=e.clientX;st.lt=performance.now();cam.v=0;cam.tx=null;}
    return;
  }
  if(st.kind==='pan'){
    const dxl=(e.clientX-st.lx)*K,now=performance.now(),dt=Math.max(8,now-st.lt)/1000;
    cam.x=clamp(cam.x-dxl,0,cam.max);cam.v=cam.v*.5+(-dxl/dt)*.5;st.lx=e.clientX;st.lt=now;return;
  }
  if(st.kind==='stir'&&drag&&e.pointerId===drag.id&&!S.done)stirMove(e);
});
function stirMove(e){
  const x=toWorldCss(e.clientX),y=e.clientY,dx=x-pot.cx,dy=y-pot.cy,r=Math.hypot(dx,dy),now=performance.now();
  S.spoon.x=x;S.spoon.y=y;drag.moved+=Math.hypot(x-drag.lx,y-drag.ly);drag.lx=x;drag.ly=y;
  const a=Math.atan2(dy,dx);let da=a-drag.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
  if(r<pot.R*.84&&r>pot.R*.12){
    if(tool==='spoon'){
      const dt=Math.max(0.008,(now-drag.t)/1000);S.swirlT=clamp(da/dt,-9,9);
      if(Math.abs(da)>0.004){S.lastStirReal=now;S.turns+=Math.abs(da)/TAU;S.sinceStir=0;}
      if(S.turns>=2){S.turns-=2;S.revCount++;Snd.swish();}
      const empty=S.wet<=0.3&&S.oil<=0.3&&S.solidsVol<=0.1;
      drag.q+=Math.abs(da);
      if(drag.q>Math.PI/2){drag.q=0;if(empty)Snd.ping(470+Math.random()*90,0.12,dx/pot.R*.6);else if(S.pieces.length&&Math.random()<.7)Snd.plop(0,0,dx/pot.R*.6);}
    }else{
      for(let i=S.foam.length-1;i>=0;i--){const f=S.foam[i],fx=pot.cx+f.x*surf.sf,fy=pot.cy+surf.oy+f.y*surf.sf;
        if(Math.hypot(fx-x,fy-y)<f.r*surf.sf+pot.R*.12){S.foam.splice(i,1);S.skimCount++;Snd.scoop();S.rings.push({x:pot.cx+f.x,y:pot.cy+f.y,r:3,max:14,a:.5});}}
    }
  }else S.swirlT=0;
  drag.a=a;drag.t=now;
}
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  if(drag.moved<8&&performance.now()-drag.t0<300&&!S.done){
    const empty=S.wet<=0.3&&S.oil<=0.3;
    if(empty)Snd.ping(430+Math.random()*120,0.3,(drag.lx-pot.cx)/pot.R*.6);else{Snd.plop(1,0.6,0);S.rings.push({x:drag.lx,y:drag.ly,r:2,max:pot.R*.25,a:.6});}
  }
  drag=null;S.spoon.on=false;S.swirlT=0;
}
function endPtr(e){
  const st=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(!st)return;
  if(st.kind==='jar'){
    clearTimeout(st.timer);
    if(st.started)stopAdd(st.j.id);
    else if(!st.moved&&e.type==='pointerup'){
      const d=ING[st.j.id];startAdd(st.j.id);
      if(d.kind!=='sol')setTimeout(()=>stopAdd(st.j.id),d.kind==='liq'?380:60);
    }
  }
  if(st.kind==='stir')endDrag(e);
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.tx=null;cam.x=clamp(cam.x+(e.deltaX||e.deltaY)*K,0,cam.max);},{passive:false});

function save(){try{localStorage.setItem('hervor.v1',JSON.stringify({stars:saved.stars,showSteps}));}catch(_){}}
function load(){try{const s=JSON.parse(localStorage.getItem('hervor.v1')||'null');if(s){saved.stars=s.stars||{};showSteps=s.showSteps!==false;}}catch(_){}}
function buildMenu(){
  const l=$('#list');l.innerHTML='';
  $('#showV').textContent=showSteps?'sí':'no';
  RECIPES.forEach((r,i)=>{
    const b=document.createElement('button');const st=saved.stars[r.id]||0;
    const lock=i>0&&!(saved.stars[RECIPES[i-1].id]>0);
    b.className='rc'+(lock?' lock':'');
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="t"><b>'+r.name+'</b><span>'+r.desc+'</span></span><span class="s">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</span>';
    b.addEventListener('click',()=>{goFs();Snd.init();startRecipe(i);});
    l.appendChild(b);
  });
}
function startRecipe(i){
  ri=i;R=JSON.parse(JSON.stringify(RECIPES[i]));si=0;S=newPot();speed=1;paused=false;
  $('#bSpeed').textContent='×1';setTool('spoon');
  mode='play';$('#menu').classList.add('hidden');$('#res').classList.add('hidden');$('#card').classList.add('hidden');
  ['#stepbar','#dock'].forEach(s=>$(s).classList.remove('hidden'));
  $('#rName').textContent=R.name;
  const others=Object.keys(ING).filter(k=>!R.ing.includes(k)),ids=R.ing.slice();
  const nd=Math.min(i,5);for(let k=0;k<nd;k++){const j=Math.floor(Math.random()*others.length);ids.push(others.splice(j,1)[0]);}
  if(i>=2)ids.sort(()=>Math.random()-.5);else ids.sort();
  shelfIds=ids;cam.centered=false;layout();setFire(0,true);
  startStep();refreshUI();
  if(!toastedPan){toastedPan=true;toast('Deslizá la pantalla para ver los frascos de la mesada. Tocá uno para agregarlo.',5000);}
}
function startAdd(id){
  if(mode!=='play'||paused||S.done)return;
  const d=ING[id];
  if(!R.ing.includes(id)){mistake('decoy','Eso no va en esta receta');const jj=jars.find(j=>j.id===id);if(jj)jj.flash=.5;return;}
  const st=R.steps[si],cur=st&&st.t==='add'&&st.ing===id;
  let kind=null;
  if(!cur)kind=(S.inPot[id]||0)>=reqTotal(R,id)-0.01?'over':'order';
  if(d.kind==='sol'){
    if(fill()+0.25>CAP){mistake('spill','La olla está llena');return;}
    if(kind)mistake(kind,kind==='over'?'De más: ya está todo lo necesario':'Fuera de orden');
    addAmount(id,1);spawnPieces(id,1);
    Snd.plop(S.wet>0.3?1:0,1,0);
    if(S.wet>0.3)spatter(S.T>60?4:2);
    S.rings.push({x:pot.cx,y:pot.cy,r:3,max:pot.R*.3,a:.6});
    refreshUI();return;
  }
  if(kind)mistake(kind,kind==='over'?'De más: ya está todo lo necesario':'Fuera de orden');
  if(d.kind==='pow'){let a=1;const st2=R.steps[si];if(st2&&st2.t==='add'&&st2.ing===id)a=Math.min(1,st2.n-(S.inPot[id]||0));
    if(a>0.001&&fill()+a<=CAP){addAmount(id,a);powderFx(d,a);Snd.tok();}}
  S.pour={id,done:false,fill:fill()/CAP};
}
function stopAdd(id){if(S&&S.pour&&S.pour.id===id){S.pour=null;refreshUI();}}
function setFire(l,silent){
  const prev=S.burner;S.burner=l;
  if(!silent){if(prev===0&&l>0)Snd.ignite();else if(l===0&&prev>0)Snd.snuff();else Snd.tok();}
}
$('#bHome').addEventListener('click',()=>{cam.tx=cam.max/2;});
function setTool(t){tool=t;$('#tSpoon').classList.toggle('on',t==='spoon');$('#tSkim').classList.toggle('on',t==='skim');}
$('#tSpoon').addEventListener('click',()=>setTool('spoon'));$('#tSkim').addEventListener('click',()=>setTool('skim'));
$('#bSpeed').addEventListener('click',()=>{
  const st=R&&R.steps[si];if(st&&st.t==='cut'){toast('Aquí hay que mirar con calma: velocidad ×1');return;}
  speed=speed===1?3:speed===3?6:1;$('#bSpeed').textContent='×'+speed;
});
function showCard(){
  paused=true;
  $('#cardIn').innerHTML='<h2>'+R.name+'</h2><div class="sub">'+R.desc+'</div><ol>'+R.steps.map((s,i)=>'<li class="'+(i<si?'done':i===si?'cur':'')+'">'+stepText(s)+'</li>').join('')+'</ol><button class="go" id="cClose">Seguir cocinando</button>';
  $('#card').classList.remove('hidden');$('#cClose').addEventListener('click',()=>{$('#card').classList.add('hidden');paused=false;});
}
$('#bRecipe').addEventListener('click',()=>{if(mode==='play'&&!S.done)showCard();});
$('#bMenu').addEventListener('click',()=>{if(mode==='play')backToMenu();});
$('#bShow').addEventListener('click',()=>{showSteps=!showSteps;save();$('#showV').textContent=showSteps?'sí':'no';});
function backToMenu(){
  mode='menu';paused=false;S=newPot();R=null;
  ['#stepbar','#dock'].forEach(s=>$(s).classList.add('hidden'));shelfIds=[];cam.centered=false;layout();
  $('#res').classList.add('hidden');$('#card').classList.add('hidden');$('#menu').classList.remove('hidden');
  $('#rName').textContent='Hervor';buildMenu();
}
function hintFor(st){const p=S.phase;if(st.ph==='sizzle')return S.T<105?'subir el fuego':'bajar el fuego';
  if(st.ph==='simmer')return p==='boil'?'bajar el fuego':'esperar el hervor';
  return p==='simmer'?'subir el fuego':'esperar el hervor';}
function refreshUI(){
  if(!R)return;
  const st=R.steps[si],nx=R.steps[si+1];
  if(showSteps){$('#stepNow').textContent=st?stepText(st):'¡Listo!';$('#stepNext').textContent=nx?'Después: '+stepText(nx):'';}
  else{$('#stepNow').textContent='Paso '+(Math.min(si+1,R.steps.length))+' de '+R.steps.length;$('#stepNext').textContent='Se puede mirar la receta en cualquier momento';}
  let pr='';
  if(st){
    if(st.t==='cook'){pr=(st.ok?'':'⏸ ')+fmtT(st.cookT||0)+' / '+fmtT(st.min)+(st.stir?' · revueltas '+(st.wins||0)+'/'+st.stir:'')+(st.skim?' · espumas '+Math.min(st.skim,S.skimCount-st.skimAt)+'/'+st.skim:'')+(st.ok?'':' · '+hintFor(st));}
    else if(st.t==='stir')pr='Revueltas '+Math.min(st.n,S.revCount-st.revAt)+'/'+st.n;
    else if(st.t==='add'){const have=S.inPot[st.ing]||0;pr=fmtM(Math.min(have,st.n))+' / '+st.n;}
    else if(st.t==='heat')pr=(st.to==='boil'?'Temperatura ':'Aceite ')+Math.round(S.T)+'°';
    else if(st.t==='cut')pr='Mirá el color y las burbujas…';
  }
  $('#stepProg').textContent=pr;
  $('#tSpoon').classList.toggle('pulse',!!S.prompt);
  $('#tSkim').classList.toggle('pulse',S.foam.length>0);
}
function showResult(ok,msg){
  mode='result';const m=S.mist;let tot=0;for(const k in m)tot+=m[k];
  let stars=0;
  if(ok){stars=(tot===0&&S.burn<0.25)?3:tot<=2?2:1;saved.stars[RECIPES[ri].id]=Math.max(saved.stars[RECIPES[ri].id]||0,stars);save();}
  const rows=Object.keys(m).filter(k=>m[k]>0).map(k=>'<div><span>'+MNAME[k]+'</span><b>'+m[k]+'</b></div>').join('');
  const lastR=ri>=RECIPES.length-1;
  $('#resIn').innerHTML='<h2>'+(ok?R.name+': listo':msg||'Se quemó')+'</h2><div class="sub">'+(ok?'Tiempo de cocina: '+fmtT(S.clock):'Se puede intentar de nuevo con más calma.')+'</div>'+
    (ok?'<div class="stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div>':'')+
    '<div class="mist">'+(rows||(ok?'<div><span>Sin errores</span><b>✓</b></div>':''))+'</div>'+
    '<button class="go" id="rRetry">Reintentar</button>'+(ok&&!lastR?'<button class="go" id="rNext">Siguiente receta</button>':'')+'<button class="go sec" id="rMenu">Recetas</button>';
  $('#res').classList.remove('hidden');
  $('#rRetry').addEventListener('click',()=>startRecipe(ri));
  const n=$('#rNext');if(n)n.addEventListener('click',()=>startRecipe(ri+1));
  $('#rMenu').addEventListener('click',backToMenu);
}
function fsOn(){return document.fullscreenElement||document.webkitFullscreenElement;}
function goFs(){const el=document.documentElement;try{if(localStorage.getItem('minigames.fs')==='0')return;if(!fsOn()){const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const r=f.call(el);if(r&&r.catch)r.catch(()=>{});}}}catch(_){}}
addEventListener('resize',layout);
document.addEventListener('fullscreenchange',()=>setTimeout(layout,150));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(layout,150));

/* ================= BUCLE ================= */
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(mode==='play'&&!paused&&!S.done){
    const n=speed;const h=dt/n;
    for(let i=0;i<n;i++)sim(h);
  }
  visuals(dt);
  uiT+=dt;
  if(uiT>0.12){uiT=0;if(mode==='play')refreshUI();$('#rState').textContent=R?(PNAME[S.phase]||''):'';$('#clock').textContent=fmtT(S.clock);$('#temp').textContent=Math.round(S.T)+'°';}
  render();
  requestAnimationFrame(loop);
}
load();layout();buildMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
