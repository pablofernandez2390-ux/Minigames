<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a120a">
<title>Carrera de Minería</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="coins.js"></script>
<style>
:root{--ink:#f3e7d3;--oro:#ffd23f;--pan:rgba(14,9,4,.93)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a120a;overflow:hidden;overscroll-behavior:none}
body{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;left:0;top:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:'Courier New',monospace;touch-action:manipulation}
#top{position:fixed;left:0;right:0;top:0;z-index:5;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(to bottom,rgba(12,7,3,.97),rgba(12,7,3,.75) 80%,transparent)}
#score{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.pl{flex:1 1 40%;max-width:200px;min-width:96px;background:#2a1c0e;border:2px solid #4a3420;border-radius:8px;padding:3px 7px;font-size:11px;line-height:1.35}
.pl.on{border-color:var(--oro);box-shadow:0 0 8px rgba(255,210,63,.45)}
.pl b{display:block;font-size:12px;white-space:nowrap}
.pl .pts{font-size:15px;color:var(--oro)}
.pl .bag{display:flex;gap:2px;flex-wrap:wrap;min-height:14px}
.pl .bag img{width:13px;height:13px}
#lvl{text-align:center;font-size:11px;color:#cdb796;margin-top:3px}
#bot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(12,7,3,.97),rgba(12,7,3,.82) 80%,transparent);display:flex;flex-direction:column;align-items:center;gap:6px}
#turnRow{display:flex;align-items:center;gap:10px}
#turnT{font-size:15px;color:var(--oro);text-shadow:2px 2px 0 #000}
#bGear{width:34px;height:30px;border-radius:8px;border:0;background:#3a2614;color:var(--ink);font-size:16px;cursor:pointer}
#turnD{font-size:12px;font-weight:400;color:#d8c6aa;text-align:center;max-width:560px;min-height:16px}
.flags{display:flex;gap:6px;font-size:11px}
.flags span{padding:2px 8px;border-radius:7px;background:#2a1c0e;border:1px solid #5a3e24}
.flags span.used{opacity:.35;text-decoration:line-through}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{font:900 15px 'Courier New',monospace;letter-spacing:.05em;color:#1a1009;background:var(--oro);border:0;border-radius:11px;padding:12px 22px;box-shadow:0 4px 0 #9a6f10;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6f10}
.btn:disabled{opacity:.35}
.btn.sec{background:#3a2614;color:var(--ink);box-shadow:0 4px 0 #160d05}
.btn.sm{font-size:12px;padding:9px 12px}
#log{position:fixed;left:50%;transform:translateX(-50%);z-index:6;bottom:140px;width:min(94vw,520px);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
#log div{background:var(--pan);border:2px solid #6b4a2a;border-radius:9px;padding:5px 10px;font-size:13px;text-align:center;animation:inl .25s ease-out}
#log div.good{border-color:#5ab06a}#log div.bad{border-color:#d0503a}#log div.gold{border-color:var(--oro)}
@keyframes inl{from{transform:translateY(10px);opacity:0}}
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(12,7,3,.8)}
.box{width:min(560px,96vw);max-height:94vh;overflow-y:auto;background:#24170b;border:3px solid #6b4a2a;border-radius:16px;padding:16px;touch-action:pan-y;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.logo{margin:0;text-align:center;font-size:clamp(22px,6vw,34px);letter-spacing:.06em;color:var(--oro);text-shadow:2px 2px 0 #000,4px 4px 0 #7a4a10;line-height:1.15}
.sub{text-align:center;font-size:12px;font-weight:400;color:#cdb796;margin:6px 0 12px}
.box h3{margin:12px 0 6px;font-size:13px;color:var(--oro);letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seg button{font:700 13px "Courier New",monospace;background:#3a2614;color:var(--ink);border:2px solid #5a3e24;border-radius:9px;padding:8px 10px;min-width:64px}
.seg button.on{border-color:var(--oro);background:#5a3a14}
.seg button small{display:block;font-size:10px;font-weight:400;color:#cdb796}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.seat{display:flex;align-items:center;gap:6px;background:#2a1c0e;border-radius:9px;padding:5px 8px;font-size:12px}
.seat .dot{width:12px;height:12px;border-radius:50%}
.seat button{margin-left:auto;font:700 11px 'Courier New',monospace;background:#4a3220;color:var(--ink);border:0;border-radius:7px;padding:6px 8px;min-width:72px}
.seat button.cpu{background:#26394a}
.rules{font-size:12px;font-weight:400;color:#d8c6aa;line-height:1.5}
.rules b{color:var(--ink)}
.rules p{margin:5px 0}
.leg{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;margin:6px 0}
.leg img{width:28px;height:28px;border-radius:5px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.res td{padding:4px 6px;border-bottom:1px dashed #5a3e24;text-align:center}
table.res td:first-child{text-align:left}
@media (max-height:500px){#turnD{display:none}.pl{font-size:10px;padding:1px 5px;line-height:1.2}#bot{padding-top:4px;gap:4px;flex-direction:row;justify-content:center;flex-wrap:wrap}.btn{padding:9px 16px}}
</style>
</head>
<body>
<canvas id="c3"></canvas>
<div id="top"><div id="score"></div><div id="lvl"></div></div>
<div id="log"></div>
<div id="bot">
  <div id="turnRow"><div id="turnT">—</div><button id="bGear" aria-label="Menú">☰</button></div>
  <div class="flags" id="flags"><span id="fMove">MOVER</span><span id="fPick">PICAR</span></div>
  <div id="turnD"></div>
  <div class="acts" id="acts">
    <button class="btn sec sm" id="bEnd">TERMINAR TURNO</button>
    <button class="btn" id="bThrow" disabled>PICAR</button>
  </div>
</div>

<div class="scr" id="menu">
  <div class="box">
    <h1 class="logo">CARRERA<br>DE MINERÍA</h1>
    <p class="sub">Picá el tablero de dados y llevate los minerales más duros</p>
    <h3>MAPA</h3>
    <div class="seg" id="maps"></div>
    <h3>JUGADORES</h3>
    <div class="seg" id="nPl"></div>
    <div class="seats" id="seats" style="margin-top:8px"></div>
    <div class="row"><button class="btn" id="bStart">EMPEZAR</button><button class="btn sec" id="bRules">REGLAS</button><a class="btn sec" href="index.html" style="text-decoration:none">SALIR</a></div>
  </div>
</div>
<div class="scr hidden" id="rules">
  <div class="box">
    <h1 class="logo" style="font-size:24px">REGLAS</h1>
    <div class="rules" id="rulesBody"></div>
    <div class="row"><button class="btn" id="bRulesOk">ENTENDIDO</button></div>
  </div>
</div>
<div class="scr hidden" id="pause">
  <div class="box" style="width:min(340px,94vw);text-align:center">
    <h1 class="logo" style="font-size:22px">PAUSA</h1>
    <div class="row" style="flex-direction:column;align-items:center">
      <button class="btn" data-p="seguir">SEGUIR</button>
      <button class="btn sec" data-p="reglas">REGLAS</button>
      <button class="btn sec" data-p="vel" id="bVel">VELOCIDAD CPU: NORMAL</button>
      <button class="btn sec" data-p="menu">NUEVA PARTIDA</button>
      <a class="btn sec" href="index.html" style="text-decoration:none">SALIR</a>
    </div>
  </div>
</div>
<div class="scr hidden" id="end">
  <div class="box" style="width:min(420px,94vw);text-align:center">
    <h1 class="logo" id="endT">FIN</h1>
    <div id="endD" class="sub"></div>
    <div class="row"><button class="btn" id="bNext">SIGUIENTE MAPA</button><button class="btn sec" id="bAgain">REPETIR</button><button class="btn sec" id="bMenu">MENÚ</button></div>
  </div>
</div>
