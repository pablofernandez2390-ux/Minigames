/* 1 pixel de la interfaz = 2 px CSS */
:root{--pan:#2a1f12;--pan2:#3a2c18;--hi:#6b5230;--lo:#160f07;--line:#0c0804;--ink:#f3e6cc;--dim:#b09a74;--oro:#ffcf4a;
  --notch:polygon(2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px),0 2px,2px 2px);
  --notch4:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b2414;overflow:hidden;overscroll-behavior:none;font:16px/1 'Tiny5',monospace;font-synthesis:none;-webkit-font-smoothing:none;color:var(--ink);-webkit-user-select:none;user-select:none}
b,strong,h3{font-weight:400}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
/* marco pixelado: contorno oscuro + luz arriba-izquierda + sombra abajo-derecha + esquinas mordidas */
.b,.fab,.cb,#info,#res span,#toast,#placeBar,.pan,.bRow{border:0;border-radius:0;background:var(--pan2);color:var(--ink);font:inherit;clip-path:var(--notch);
  box-shadow:inset 0 0 0 2px var(--line),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.b:active,.fab:active,.cb:active,.bRow:active{box-shadow:inset 0 0 0 2px var(--line),inset 4px 4px 0 0 var(--lo),inset -4px -4px 0 0 var(--hi);transform:translateY(2px)}
.pi{display:inline-block;width:24px;height:24px;flex:0 0 24px;background:center/24px 24px no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:4px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));pointer-events:none;flex-wrap:wrap;z-index:5}
#menu{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
body.edit #res,body.edit #bSC{display:none}
@media (max-width:899px){#menu .lbl{display:none}#menu .b{padding:2px 6px 0}}
.b{pointer-events:auto;height:36px;min-width:36px;padding:2px 10px 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.b .pi{margin:0 -2px}
.b.on{background:var(--oro);color:#20160a;box-shadow:inset 0 0 0 2px var(--line),inset 4px 4px 0 0 #fff09a,inset -4px -4px 0 0 #b07a10}
#info{align-self:flex-start;pointer-events:none;padding:8px 10px 6px;font-size:8px;line-height:10px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tools{display:none;gap:4px;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools.on{display:flex}
#tools .b{flex:0 0 auto}
#tools .b i.sw{display:inline-block;width:14px;height:14px;box-shadow:inset 0 0 0 2px var(--line)}
#res{display:flex;gap:4px;pointer-events:none;flex-wrap:wrap}
#res span{padding:4px 8px 4px 4px;display:flex;align-items:center;gap:2px}
#res span.bump{animation:bump .4s steps(3)}@keyframes bump{30%{background:#6a5220;transform:translateY(-2px)}}
#placeBar{align-self:center;display:none;align-items:center;gap:8px;background:#1d4a22;box-shadow:inset 0 0 0 2px var(--line),inset 4px 4px 0 0 #3f8a3a,inset -4px -4px 0 0 #0e2a12;padding:6px 6px 6px 12px;max-width:100%}
#placeBar.on{display:flex}
#bPanel,#scPanel{position:fixed;inset:0;z-index:20;background:rgba(8,6,3,.72);display:none;align-items:center;justify-content:center;padding:14px}
#bPanel.on,#scPanel.on{display:flex}
.pan{background:var(--pan);clip-path:var(--notch4);box-shadow:inset 0 0 0 2px var(--line),inset 0 0 0 4px var(--hi),inset 0 0 0 6px var(--line);padding:16px;width:min(470px,100%);max-height:100%;overflow-y:auto;scrollbar-width:none}
.pan h3{margin:0 0 10px;color:var(--oro);font-size:24px;line-height:24px;text-shadow:2px 2px 0 var(--line)}
.bRow{display:grid;grid-template-columns:28px 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;row-gap:4px;width:100%;text-align:left;padding:10px 12px;margin:4px 0;cursor:pointer}
.bRow .ic{grid-row:span 2}.bRow small{grid-column:2;color:var(--dim);font-size:8px;line-height:8px}.bRow em{grid-row:span 2;grid-column:3;font-style:normal;white-space:nowrap;display:flex;align-items:center;gap:2px}
.bRow em .pi{margin-left:4px}
.bRow.no{opacity:.45}
.pan .row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-top:10px}
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:4px;padding:0 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));pointer-events:none;z-index:5}
#bottom>*{pointer-events:auto}
#bar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}
body.edit #bar,body.spect #bar{display:none}
#fabs{display:flex;gap:4px}
/* botones de órdenes: baldosas de ícono + nombre, como el panel de AOE */
.fab,.cb{flex:0 0 auto;width:62px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 3px 0;cursor:pointer}
.fab small,.cb small{font-size:8px;line-height:8px;text-align:center;max-width:56px;overflow:hidden;max-height:16px}
.fab.dim,.cb.dim{opacity:.45}.fab.soon,.cb.soon{opacity:.4}
.cb small.c{color:var(--dim);display:flex;gap:2px;align-items:center;max-height:12px}.pi.s{width:12px;height:12px;flex:0 0 12px;background-size:12px 12px}
.cb{width:auto;min-width:62px}
#ctxbar{display:none;gap:4px}
#ctxbar.on{display:flex}
#ctxbar.on::before{content:'';flex:0 0 2px;background:var(--line);margin:6px 2px}
#scPanel p{color:var(--dim);margin:4px 0 10px;font-size:8px;line-height:12px}#scPanel p.small{margin-top:12px}
.scRow{display:flex;align-items:center;gap:8px;padding:6px 4px;box-shadow:0 2px 0 #3a2e1c;cursor:pointer}
.scRow input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;flex:0 0 20px;background:var(--lo);box-shadow:inset 0 0 0 2px var(--line),inset 2px 2px 0 2px #000;cursor:pointer}
.scRow input:checked{background:var(--oro);box-shadow:inset 0 0 0 2px var(--line),inset 0 0 0 6px #fff09a,inset 0 0 0 6px var(--oro)}
.scRow input:checked{background:radial-gradient(var(--oro) 0 0) center/8px 8px no-repeat,var(--lo)}
.scRow b{flex:1}.scRow small{color:var(--dim);font-size:8px}
body.s-menu #top,body.s-menu #bottom{display:none}
#menu .b{display:none}body.s-play #menu .pl,body.s-mapedit #menu .me,body.s-partedit #menu .pe,body.s-test #menu .te{display:inline-flex}
#bObj .lbl{display:inline!important}
#scr,#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:25}
#scr{background:rgba(10,7,3,.45)}#dlg{background:rgba(8,6,3,.72);z-index:32}#scr.on,#dlg.on{display:flex}
.home{display:flex;flex-direction:column;align-items:center;gap:10px;max-height:100%;overflow-y:auto;scrollbar-width:none}
.home h1{margin:0;font-size:64px;line-height:72px;font-weight:400;color:var(--oro);letter-spacing:6px;text-shadow:4px 0 0 #1a1008,-4px 0 0 #1a1008,0 4px 0 #1a1008,0 -4px 0 #1a1008,4px 4px 0 #1a1008,-4px 4px 0 #1a1008,4px -4px 0 #1a1008,-4px -4px 0 #1a1008,0 8px 0 #6b5230,4px 8px 0 #6b5230,-4px 8px 0 #6b5230}
.home h2{margin:0 0 6px;font-size:24px;line-height:24px;font-weight:400;color:var(--oro);text-shadow:2px 2px 0 #1a1008}
.home .sub{margin:0 0 10px;text-shadow:2px 2px 0 #1a1008}
.b.big{width:min(340px,86vw);height:58px;justify-content:flex-start;padding:2px 16px 0;gap:12px}
.b.big span{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.b.big small{font-size:8px;line-height:8px;color:var(--dim)}
.lst{width:min(640px,100%)}.rows{display:flex;flex-direction:column;gap:4px;max-height:56vh;overflow-y:auto;scrollbar-width:none}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--pan2);clip-path:var(--notch);box-shadow:inset 0 0 0 2px var(--line),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--lo)}
.lrow.no{opacity:.5}.lt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.lt small{font-size:8px;line-height:10px;color:var(--dim)}

'use strict';
/* =====================================================================
   Motor isométrico — prototipo 1
   Tiles 96×48 (rombo 2:1), alturas de 16 px por nivel, unidades 64×64.
   Movimiento "de torre": 4 direcciones siguiendo la grilla.
   ===================================================================== */
const $ = id => document.getElementById(id);
const TW = 96, TH = 48, HW = TW / 2, HH = TH / 2, LV = 16;   // tamaño del tile y alto de cada nivel
const MW = 64, MH = 64;                                      // tamaño del mapa en tiles
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
let tt; function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1900); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
// ruido determinista
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

/* ---------------- terrenos ---------------- */
const TER = {
  pasto: { name: 'Pasto', c: ['#5f8f3c', '#6a9c44', '#557f35', '#7aad4e'], wall: ['#7a5a36', '#5e4429'] },
  tierra: { name: 'Tierra', c: ['#8a6a42', '#977549', '#7a5d39', '#a3825a'], wall: ['#6e5233', '#553f27'] },
  arena: { name: 'Arena', c: ['#d8c48a', '#e2cf96', '#c9b57c', '#ecdca8'], wall: ['#b49a62', '#96804f'] },
  agua: { name: 'Agua', water: true },
};
// rombo de 96×48 con textura de píxeles
function inDiamond(x, y) { return Math.abs(x + .5 - HW) / HW + Math.abs(y + .5 - HH) / HH <= 1; }
const TILE = {};
function buildTiles() {
  for (const k in TER) { const T = TER[k]; if (T.water) continue; TILE[k] = [];
    for (let v = 0; v < 4; v++) { const c = mk(TW, TH), g = c.getContext('2d'), cols = T.c.map(hex);
      const im = g.createImageData(TW, TH), d = im.data;
      for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) { if (!inDiamond(x, y)) continue;
        const n = vnoise(x / 7 + v * 13, y / 4, 3) * .7 + hash(x, y, v) * .3; let ci = n < .3 ? 2 : n < .62 ? 0 : n < .85 ? 1 : 3;
        if (k === 'pasto' && hash(x, y, v + 9) > .985) ci = 3;   // briznas claras
        const p = (y * TW + x) * 4, cc = cols[ci]; d[p] = cc[0]; d[p + 1] = cc[1]; d[p + 2] = cc[2]; d[p + 3] = 255; }
      g.putImageData(im, 0, 0); TILE[k].push(c); }
    // paredes (laterales) de un nivel de alto: izquierda más clara, derecha más oscura
    const wl = mk(HW, HH + LV), wr = mk(HW, HH + LV), [c1, c2] = T.wall.map(hex);
    for (const [cv, col, left] of [[wl, c1, true], [wr, c2, false]]) { const g = cv.getContext('2d'), im = g.createImageData(HW, HH + LV), d = im.data;
      for (let y = 0; y < HH + LV; y++) for (let x = 0; x < HW; x++) {
        // franja entre la diagonal superior y la inferior
        const top = left ? HH * (x / HW) : HH * (1 - x / HW), bot = top + LV; if (y < top || y >= bot) continue;
        const n = hash(x, y, left ? 5 : 6) * .25 - (y - top < 2 ? -.15 : 0), p = (y * HW + x) * 4;
        d[p] = col[0] * (1 + n - .1); d[p + 1] = col[1] * (1 + n - .1); d[p + 2] = col[2] * (1 + n - .1); d[p + 3] = 255; }
      g.putImageData(im, 0, 0); }
    T.wl = wl; T.wr = wr; }
  // agua: 6 cuadros con ciclo de colores (olas) + variante de orilla
  TILE.agua = []; TILE.orilla = [];
  for (const [list, base] of [[TILE.agua, ['#2a6a98', '#3780b0', '#215a85', '#9fd6f2']], [TILE.orilla, ['#3b8db5', '#4aa0c6', '#2f7aa3', '#c9ecfa']]]) {
    const cols = base.map(hex);
    for (let f = 0; f < 6; f++) { const c = mk(TW, TH), g = c.getContext('2d'), im = g.createImageData(TW, TH), d = im.data;
      for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) { if (!inDiamond(x, y)) continue;
        const w = Math.sin(x * .19 + y * .55 + f * Math.PI / 3) + Math.sin(x * .07 - y * .31 - f * Math.PI / 3) * .6 + (vnoise(x / 9, y / 5, 7) - .5);
        const ci = w > 1.25 ? 3 : w > .55 ? 1 : w < -.9 ? 2 : 0, p = (y * TW + x) * 4, cc = cols[ci]; d[p] = cc[0]; d[p + 1] = cc[1]; d[p + 2] = cc[2]; d[p + 3] = 255; }
      g.putImageData(im, 0, 0); list.push(c); } }

const WORK_ANIM = { madera: 'punch' };
// talar: de pie mientras el árbol está parado; caído, agachado con el hacha sobre el tronco
const workAnim = u => { if (u.task.res === 'madera') { const o = map.o[u.task.k]; return o && o.ft !== undefined ? 'pick' : 'punch'; } return WORK_ANIM[u.task.res] || 'pick'; };
// qué cuadros de "agarrar" usa cada trabajo: bayas y agua el gesto completo; el resto, el golpe agachado repetido
const WORK_SEQ = { alimento: [0, 1, 2, 3, 4], agua: [0, 1, 2, 2, 3, 4], madera: [0, 3, 4, 5, 5, 0], piedra: [4, 0, 1, 3, 3, 0], oro: [4, 0, 1, 3, 3, 0] };
/* ---------------- herramientas pintadas encima de la animación ----------------
   Se dibujan por código enganchadas a la mano: POSE[dir][cuadro] = [x, y, ángulo°] dentro del cuadro de la animación "pick".
   Ángulo: 0 = derecha, 90 = abajo. Las direcciones espejadas invierten x y ángulo. */
const TOOL_OF = { madera: 'hacha', piedra: 'pico', oro: 'pico' };
const POSE = {
  SW: { 0: [34, 41, -125], 1: [28, 48, 168], 3: [24, 50, 128], 4: [37, 30, -70] },
  NW: { 0: [20, 39, -115], 1: [17, 40, -160], 3: [14, 42, -168], 4: [17, 37, -65] },
};
// manos en la animación de golpe: guardia con el hacha levantada atrás, cuadro 5 = hachazo lateral
const POSE_PUNCH = {
  SW: { 0: [29, 38, -60], 3: [32, 34, -75], 4: [33, 35, -85], 5: [19, 54, 165] },
  NW: { 0: [29, 45, -70], 3: [27, 45, -80], 4: [27, 44, -95], 5: [27, 36, -150] },
};
const POSES = { pick: POSE, punch: POSE_PUNCH };
// ¿la herramienta queda detrás del cuerpo? De frente (SW) mira a la izquierda: si apunta hacia arriba-derecha va por la espalda.
// De espaldas (NW) todo va detrás salvo lo que apunta hacia la cámara (abajo-derecha).
const toolBehind = (base, ang) => base === 'SW' ? ang > -100 && ang < 30 : !(ang > -10 && ang < 100);
const TOOL_COL = { mango: '#8a5a2c', mangoL: '#b07a44', borde: '#1e140a', pie: '#8f8f98', pieL: '#cfd0d8', pieD: '#5a5a62' };
function drawTool(kind, hx, hy, ang, flip) {
  const a = ang * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), px = -uy * (flip ? -1 : 1), py = ux * (flip ? -1 : 1), L = 15, P = [];
  const dot = (x, y, c) => P.push([Math.round(x), Math.round(y), c]);
  for (let t = -2; t <= L; t += .5) { dot(hx + ux * t, hy + uy * t, t % 2 < 1 ? TOOL_COL.mango : TOOL_COL.mangoL); }
  const ex = hx + ux * L, ey = hy + uy * L;
  if (kind === 'pico') for (let q = -6; q <= 6; q += .5) { const bend = Math.abs(q) * .28; dot(ex + px * q - ux * bend, ey + py * q - uy * bend, Math.abs(q) > 4.5 ? TOOL_COL.pieL : q < 0 ? TOOL_COL.pie : TOOL_COL.pieD); dot(ex + px * q - ux * (bend + .8), ey + py * q - uy * (bend + .8), TOOL_COL.pie); }
  else if (kind === 'hacha') for (let q = 0; q <= 6; q += .5) for (let t = -4.5; t <= .5; t += .5) { const w = 2.5 + q * .45; if (Math.abs(t + 2) > w) continue; dot(ex + px * q + ux * t, ey + py * q + uy * t, q > 5 ? TOOL_COL.pieL : t > -1 ? TOOL_COL.pieD : TOOL_COL.pie); }
  else if (kind === 'azada') for (let q = 0; q <= 6; q += .5) for (let t = -1.5; t <= .5; t += .5) dot(ex + px * q + ux * t, ey + py * q + uy * t, q > 5 ? TOOL_COL.pieL : TOOL_COL.pie);
  // contorno oscuro y después los colores
  ctx.fillStyle = TOOL_COL.borde; for (const [x, y] of P) ctx.fillRect(x - 1, y, 3, 1), ctx.fillRect(x, y - 1, 1, 3);

function showMapList() { listScr('Editor de mapas', 'Los 5 primeros vienen con el juego: al editarlos se guarda una copia tuya. Tus mapas van debajo.', allMaps().map(m => ({ ic: m.pre ? 'centro' : 'lapiz', t: m.name, s: m.d, a: [['Editar', () => openMapEditor(m), 'lapiz'], ...(m.pre ? [] : [['Borrar', () => ask('¿Borrar el mapa "' + m.name + '"?', () => { LS.set('aldea.mapas', userMaps().filter(x => x.id !== m.id)); showMapList(); }), 'x']])] })),

function openMapEditor(m) { closeScr(); SCREEN = 'mapedit'; EDKIND = 'map'; editMode = true; EDDIRTY = !!m.fresh;
  EDMAP = { id: m.pre ? null : m.id, name: m.pre ? m.name + ' (copia)' : m.name };
  map = m.fresh ? genMap() : getMap(m.id); clearWorld(); setBody('s-mapedit edit'); tool = 'pasto'; buildTools(); $('tools').classList.add('on'); centerOn(MW / 2, MH / 2); refreshUI(true); placeHUD(); toast('Editando: ' + EDMAP.name); }
function saveMapEditor(then) { askText('Nombre del mapa', EDMAP.name, name => { EDMAP.name = name; if (!EDMAP.id) EDMAP.id = newId('u'); if (saveUserMap(EDMAP.id, name, map)) { EDDIRTY = false; toast('Mapa guardado: ' + name); then && then(); } }); }

/* ---------- editor de partidas: unidades y edificios sobre un mapa hecho ---------- */
const PTOOLS = [['centro0', 'Centro J1', 0, 'centro'], ['casa0', 'Casa J1', 0, 'casa'], ['f0', 'Aldeana J1', 0, 'gente'], ['m0', 'Aldeano J1', 0, 'gente'], ['centro1', 'Centro J2', 1, 'centro'], ['casa1', 'Casa J2', 1, 'casa'], ['f1', 'Aldeana J2', 1, 'gente'], ['m1', 'Aldeano J2', 1, 'gente'], ['quitar', 'Quitar', null, 'x']];
function showCampMenu() { scr(`<div class="home"><h2>Campaña</h2>${homeBtn('cCamps', 'barraca', 'Editor de campañas', 'ordenar partidas en una serie')}${homeBtn('cParts', 'lapiz', 'Editor de partidas', 'mapa, aldeas, recursos y objetivos')}${homeBtn('cBack', 'x', 'Volver')}</div>`);
  $('cCamps').onclick = showCampList; $('cParts').onclick = showPartList; $('cBack').onclick = showHome; }
function showPartList() { listScr('Editor de partidas', 'Las partidas que vienen con el juego se editan como copia.', allParts().map(P => ({ ic: P.pre ? 'play' : 'lapiz', t: P.name, s: `${mapName(P.map)} · ${P.obj.length} objetivos`, a: [['Editar', () => openPartEditor(P), 'lapiz'], ...(P.pre ? [] : [['Borrar', () => ask('¿Borrar la partida "' + P.name + '"?', () => { delUserItem('aldea.partidas', P.id); showPartList(); }), 'x']])] })),
  [['Partida nueva', () => listScr('¿Sobre qué mapa?', '', allMaps().map(m => ({ ic: 'centro', t: m.name, s: m.d, a: [['Elegir', () => openPartEditor({ id: null, name: 'Partida nueva', d: '', map: m.id, rival: true, auto: true, stock: DEF_STOCK(), obj: [{ t: 'pop', n: 10 }] }), 'ok']] })), [['Volver', showPartList, 'x']]), 'mas'], ['Volver', showCampMenu, 'x']]); }
function openPartEditor(P) { closeScr(); $('dlg').classList.remove('on'); CUR = null; SCREEN = 'partedit'; EDKIND = 'part'; editMode = true;
  EDPART = JSON.parse(JSON.stringify(P)); if (EDPART.pre) { EDPART.pre = false; EDPART.id = null; EDPART.name += ' (copia)'; }
  buildWorld(EDPART); EDPART.auto = false; setBody('s-partedit edit'); tool = 'f0'; buildTools(); $('tools').classList.add('on'); centerOn(...homeCenter()); refreshUI(true); placeHUD(); }
// lo que hay en el mundo pasa a la partida
function grabPart() { EDPART.blds = BLD.map(b => ({ k: b.k, team: b.team, i: b.i, j: b.j })); EDPART.units = UNITS.map(u => ({ team: u.team, i: u.i, j: u.j, sex: u.sex, age: Math.round(ageOf(u)) })); EDPART.auto = false; EDPART.rival = BLD.some(b => b.team === 1) || UNITS.some(u => u.team === 1); }
function savePartEditor() { grabPart(); if (!EDPART.id) EDPART.id = newId('q'); if (saveUserList('aldea.partidas', EDPART)) toast('Partida guardada: ' + EDPART.name); }
function placePart(i, j) { const t = PTOOLS.find(x => x[0] === tool); if (!t) return;
  if (tool === 'quitar') { const u = UNITS.find(q => q.i === i && q.j === j); if (u) { UNITS.splice(UNITS.indexOf(u), 1); return; } const o = OCC[idx(i, j)]; if (o >= 0) { BLD.splice(o, 1); rebuildOcc(); } return; }
  const team = t[2];
  if (tool.startsWith('centro') || tool.startsWith('casa')) { const k = tool.startsWith('centro') ? 'centro' : 'casa', w = BTYPES[k].w, gi = i - (w >> 1), gj = j - (w >> 1), bad = canPlace(k, gi, gj); if (bad) { toast(bad); return; } addBuilding(k, gi, gj, w, team, true); return; }
  if (!walkable(i, j) || UNITS.some(q => q.i === i && q.j === j)) { toast('Ahí no puede pararse nadie'); return; }
  addUnit(i, j, team, 20 + Math.round(Math.random() * 20), tool[0]); }
function partSettings() { const P = EDPART; grabPart();
  const resIn = Object.keys(RES).map(r => `<label class="fld">${PI(RES[r].ic, 's')}<input class="px-in num" type="number" min="0" step="10" data-r="${r}" value="${P.stock[r] || 0}"></label>`).join('');
  const objRows = () => P.obj.map((o, n) => `<div class="obj">${PI('ir')}<span>${esc(objText(o))}</span><button class="b sm" data-del="${n}" type="button">✕</button></div>`).join('') || '<p>Sin objetivos: se juega libre.</p>';
  const typeOpts = Object.entries(OBJ_T).map(([k, v]) => `<option value="${k}">${v.n}</option>`).join('');
  const d = dlg(`<h3>Ajustes de la partida</h3>
    <label class="fld w">Nombre<input class="px-in" id="pName" maxlength="40" value="${esc(P.name)}"></label>
    <label class="fld w">Descripción<input class="px-in" id="pDesc" maxlength="90" value="${esc(P.d || '')}"></label>
    <p>Mapa: <b>${esc(mapName(P.map))}</b> · Recursos iniciales:</p><div class="fields">${resIn}</div>
    <p>Objetivos (de chicos a ambiciosos):</p><div class="objl" id="pObj">${objRows()}</div>
    <div class="fields"><select class="px-in" id="oT">${typeOpts}</select><select class="px-in" id="oP"></select><input class="px-in num" id="oN" type="number" min="1" value="100"><button class="b sm" id="oAdd" type="button">Agregar</button></div>`,
    [['Listo', () => { P.name = $('pName').value.trim() || P.name; P.d = $('pDesc').value.trim(); d.querySelectorAll('[data-r]').forEach(e => P.stock[e.dataset.r] = Math.max(0, +e.value || 0)); }]], true);
  const fillP = () => { const t = OBJ_T[$('oT').value], p = $('oP'); p.style.display = t.p ? '' : 'none';
    p.innerHTML = t.p === 'res' ? Object.keys(RES).map(r => `<option value="${r}">${RES[r].n}</option>`).join('') : t.p === 'bld' ? Object.keys(BTYPES).map(k => `<option value="${k}">${BTYPES[k].n}</option>`).join('') : '';
    $('oN').value = { res: 300, pop: 10, bld: 1, born: 3, mil: 3, era: 2, year: 20 }[$('oT').value]; };
  const wire = () => d.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { P.obj.splice(+b.dataset.del, 1); $('pObj').innerHTML = objRows(); wire(); });
  $('oT').onchange = fillP; fillP(); wire();
  $('oAdd').onclick = () => { const t = $('oT').value, o = { t, n: Math.max(1, +$('oN').value || 1) }; if (OBJ_T[t].p === 'res') o.r = $('oP').value; if (OBJ_T[t].p === 'bld') o.k = $('oP').value; if (t === 'era') o.n = Math.min(2, o.n); P.obj.push(o); $('pObj').innerHTML = objRows(); wire(); }; }

/* ---------- editor de campañas ---------- */
function showCampList() { listScr('Editor de campañas', 'Una campaña es una serie de partidas en orden.', allCamps().map(c => ({ ic: 'barraca', t: c.name, s: c.parts.map(id => (getPart(id) || { name: '?' }).name).join(' → '), a: [['Editar', () => editCamp(c), 'lapiz'], ...(c.pre ? [] : [['Borrar', () => ask('¿Borrar la campaña "' + c.name + '"?', () => { delUserItem('aldea.campanas', c.id); showCampList(); }), 'x']])] })),
  [['Campaña nueva', () => editCamp({ id: null, name: 'Campaña nueva', d: '', parts: [] }), 'mas'], ['Volver', showCampMenu, 'x']]); }
function editCamp(c0) { const c = JSON.parse(JSON.stringify(c0)); if (c.pre) { c.pre = false; c.id = null; c.name += ' (copia)'; }
  const draw = () => { listScr('Campaña: ' + c.name, 'Ordená las partidas con las flechas.', c.parts.map((id, n) => ({ ic: 'play', t: (n + 1) + '. ' + (getPart(id) || { name: '(borrada)' }).name, s: getPart(id) ? mapName(getPart(id).map) : '',
      a: [['', () => { if (n) { [c.parts[n - 1], c.parts[n]] = [c.parts[n], c.parts[n - 1]]; draw(); } }, 'arriba'], ['', () => { if (n < c.parts.length - 1) { [c.parts[n + 1], c.parts[n]] = [c.parts[n], c.parts[n + 1]]; draw(); } }, 'abajo'], ['', () => { c.parts.splice(n, 1); draw(); }, 'x']] })),
    [['Agregar partida', () => listScr('Agregar a ' + c.name, '', allParts().map(P => ({ ic: 'play', t: P.name, s: mapName(P.map), a: [['Agregar', () => { c.parts.push(P.id); draw(); }, 'mas']] })), [['Volver', draw, 'x']]), 'mas'],
     ['Nombre', () => askText('Nombre de la campaña', c.name, v => { c.name = v; draw(); }), 'lapiz'],
     ['Guardar', () => { if (!c.parts.length) { toast('Agregá al menos una partida'); return; } if (!c.id) c.id = newId('c'); if (saveUserList('aldea.campanas', c)) { toast('Campaña guardada'); showCampList(); } }, 'ok'], ['Volver', showCampList, 'x']]); };
  draw(); }

window.__rts = { startPart, getMap, allMaps, allParts, allCamps, goMenu, openMapEditor, openPartEditor, get SCREEN() { return SCREEN; }, get CUR() { return CUR; }, placeBuilding, canPlace, BTYPES, orderBuild, get STOCK() { return STOCK; }, BLD, orderGather, resourceAt, nearestRes, idxOf: (i, j) => idx(i, j), UNITS, orderMove, cam, get map() { return map; }, setZoom, iso, idx, screenToTile, get Z() { return Z; }, setWeather: w => { weather = w; }, addUnit, killUnit, get YEAR() { return YEAR(); }, setYear: y => { GT = y * AÑO; }, get BLDS() { return BLD; }, get SELB() { return SELB; }, set SELB(b) { SELB = b; refreshUI(true); }, enqueue, releaseB, ringBell, get AGE() { return AGE; }, get TECH() { return TECH; }, buildingAt, command, refreshUI, };
</script>
