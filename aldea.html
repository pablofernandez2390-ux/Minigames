<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2414">
<title>Aldea · prototipo</title>
<style>
:root{--pan:rgba(22,18,12,.88);--line:#5a4628;--ink:#f3e6cc;--oro:#ffcf4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b2414;overflow:hidden;overscroll-behavior:none;font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));align-items:center;pointer-events:none;flex-wrap:wrap}
.b{pointer-events:auto;height:36px;min-width:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--pan);color:var(--ink);font:inherit;cursor:pointer}
.b.on{background:var(--oro);color:#20160a;border-color:#9a7414}
#info{pointer-events:none;margin-left:auto;background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:500;font-size:12px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tools{position:fixed;left:0;right:0;bottom:0;display:none;gap:5px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));overflow-x:auto;background:linear-gradient(transparent,rgba(10,8,4,.75) 40%);scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools.on{display:flex}
#tools .b{flex:0 0 auto;display:flex;align-items:center;gap:6px}
#tools .b i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.5)}
#fabs{position:fixed;inset:0;pointer-events:none;z-index:4}
.fab{position:absolute;transform:translate(-100%,-50%);pointer-events:auto;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--pan);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;cursor:pointer;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.fab span{font-size:20px;line-height:1}.fab small{font-size:8px;font-weight:600;line-height:1.05;max-width:50px;text-align:center;overflow:hidden;max-height:18px}
.fab.dim{opacity:.45}.fab.soon{opacity:.38;border-style:dashed}.fab.lift{transform:translate(-100%,-50%) scale(1.15);border-color:var(--oro);z-index:2}
body.layout .fab{outline:2px dashed var(--oro);outline-offset:2px;animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{rotate:-2deg}to{rotate:2deg}}
#ctxbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:none;gap:5px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));max-width:100vw;overflow-x:auto;scrollbar-width:none;z-index:5}
#ctxbar.on{display:flex}#ctxbar::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--pan);color:var(--ink);font:inherit;font-size:12px;padding:0 10px;display:flex;align-items:center;gap:5px;cursor:pointer}
.cb span{font-size:17px}.cb.soon{opacity:.4;border-style:dashed}
#scDone{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;z-index:6}
body.layout #scDone{display:block}
#scPanel{position:fixed;inset:0;z-index:20;background:rgba(8,6,3,.7);display:none;align-items:center;justify-content:center;padding:14px}
#scPanel.on{display:flex}
#scPanel .pan{background:#211a10;border:1px solid var(--line);border-radius:14px;padding:14px;width:min(460px,100%);max-height:100%;overflow-y:auto}
#scPanel h3{margin:0 0 4px;color:var(--oro)}#scPanel p{font-weight:500;font-size:12px;color:#cdbb98;margin:4px 0 10px}#scPanel p.small{font-size:11px;margin-top:10px}
.scRow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #3a2e1c;cursor:pointer}
.scRow input{width:18px;height:18px;accent-color:#ffcf4a}.scRow .ic{font-size:18px;width:24px;text-align:center}.scRow b{flex:1}.scRow small{color:#a8977a;font-weight:500}
#scPanel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#toast{position:fixed;left:50%;top:56px;transform:translate(-50%,-10px);background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:7px 14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;font-weight:500}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="b on" id="bPlay" type="button">▶ Jugar</button>
  <button class="b" id="bEdit" type="button">✎ Editar mapa</button>
  <button class="b" id="bZoomM" type="button">−</button>
  <button class="b" id="bZoomP" type="button">+</button>
  <button class="b" id="bWeather" type="button">☀</button>
  <button class="b" id="bSC" type="button">⚙ Atajos</button>
  <span id="info">Tocá un aldeano y después un lugar del mapa</span>
</div>
<div id="tools"></div>
<div id="fabs"></div>
<div id="ctxbar"></div>
<button id="scDone" class="b" type="button">✔ Listo</button>
<div id="scPanel"><div class="pan">
  <h3>Atajos</h3>
  <p>Elegí qué botones flotantes querés ver. Para moverlos, mantené apretado un botón y arrastralo, o usá "Acomodar".</p>
  <div id="scList"></div>
  <div class="row"><button class="b" id="scMove" type="button">✥ Acomodar botones</button><button class="b" id="scReset" type="button">Posición original</button><button class="b" id="scClose" type="button">Cerrar</button></div>
  <p class="small">En la PC: tocá la tecla del atajo. Clic derecho manda, rueda hace zoom, las flechas mueven la cámara.</p>
</div></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   Motor isométrico — prototipo 1
   Tiles 96×48 (rombo 2:1), alturas de 16 px por nivel, unidades 64×64.
   Movimiento "de torre": 4 direcciones siguiendo la grilla.
   ===================================================================== */
const $ = id => document.getElementById(id);
const TW = 96, TH = 48, HW = TW / 2, HH = TH / 2, LV = 16;   // tamaño del tile y alto de cada nivel
const MW = 64, MH = 64;                                      // tamaño del mapa en tiles
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
let tt; function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1900); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
// ruido determinista
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

/* ---------------- terrenos ---------------- */
const TER = {
  pasto: { name: 'Pasto', c: ['#5f8f3c', '#6a9c44', '#557f35', '#7aad4e'], wall: ['#7a5a36', '#5e4429'] },
  tierra: { name: 'Tierra', c: ['#8a6a42', '#977549', '#7a5d39', '#a3825a'], wall: ['#6e5233', '#553f27'] },
  arena: { name: 'Arena', c: ['#d8c48a', '#e2cf96', '#c9b57c', '#ecdca8'], wall: ['#b49a62', '#96804f'] },
  agua: { name: 'Agua', water: true },
};
// rombo de 96×48 con textura de píxeles
function inDiamond(x, y) { return Math.abs(x + .5 - HW) / HW + Math.abs(y + .5 - HH) / HH <= 1; }
const TILE = {};
function buildTiles() {
  for (const k in TER) { const T = TER[k]; if (T.water) continue; TILE[k] = [];
    for (let v = 0; v < 4; v++) { const c = mk(TW, TH), g = c.getContext('2d'), cols = T.c.map(hex);
      const im = g.createImageData(TW, TH), d = im.data;
      for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) { if (!inDiamond(x, y)) continue;
        const n = vnoise(x / 7 + v * 13, y / 4, 3) * .7 + hash(x, y, v) * .3; let ci = n < .3 ? 2 : n < .62 ? 0 : n < .85 ? 1 : 3;
        if (k === 'pasto' && hash(x, y, v + 9) > .985) ci = 3;   // briznas claras
        const p = (y * TW + x) * 4, cc = cols[ci]; d[p] = cc[0]; d[p + 1] = cc[1]; d[p + 2] = cc[2]; d[p + 3] = 255; }
      g.putImageData(im, 0, 0); TILE[k].push(c); }
    // paredes (laterales) de un nivel de alto: izquierda más clara, derecha más oscura
    const wl = mk(HW, HH + LV), wr = mk(HW, HH + LV), [c1, c2] = T.wall.map(hex);
    for (const [cv, col, left] of [[wl, c1, true], [wr, c2, false]]) { const g = cv.getContext('2d'), im = g.createImageData(HW, HH + LV), d = im.data;
      for (let y = 0; y < HH + LV; y++) for (let x = 0; x < HW; x++) {
        // franja entre la diagonal superior y la inferior
        const top = left ? HH * (x / HW) : HH * (1 - x / HW), bot = top + LV; if (y < top || y >= bot) continue;
        const n = hash(x, y, left ? 5 : 6) * .25 - (y - top < 2 ? -.15 : 0), p = (y * HW + x) * 4;
        d[p] = col[0] * (1 + n - .1); d[p + 1] = col[1] * (1 + n - .1); d[p + 2] = col[2] * (1 + n - .1); d[p + 3] = 255; }
      g.putImageData(im, 0, 0); }
    T.wl = wl; T.wr = wr; }
  // agua: 6 cuadros con ciclo de colores (olas) + variante de orilla
  TILE.agua = []; TILE.orilla = [];
  for (const [list, base] of [[TILE.agua, ['#2a6a98', '#3780b0', '#215a85', '#9fd6f2']], [TILE.orilla, ['#3b8db5', '#4aa0c6', '#2f7aa3', '#c9ecfa']]]) {
    const cols = base.map(hex);
    for (let f = 0; f < 6; f++) { const c = mk(TW, TH), g = c.getContext('2d'), im = g.createImageData(TW, TH), d = im.data;
      for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) { if (!inDiamond(x, y)) continue;
        const w = Math.sin(x * .19 + y * .55 + f * Math.PI / 3) + Math.sin(x * .07 - y * .31 - f * Math.PI / 3) * .6 + (vnoise(x / 9, y / 5, 7) - .5);
        const ci = w > 1.25 ? 3 : w > .55 ? 1 : w < -.9 ? 2 : 0, p = (y * TW + x) * 4, cc = cols[ci]; d[p] = cc[0]; d[p + 1] = cc[1]; d[p + 2] = cc[2]; d[p + 3] = 255; }
      g.putImageData(im, 0, 0); list.push(c); } }
}

/* ---------------- objetos: árboles, arbustos, piedras, oro ---------------- */
function pxArt(w, h, fn) { const c = mk(w, h), g = c.getContext('2d'), im = g.createImageData(w, h), d = im.data;
  const put = (x, y, col) => { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= w || y >= h) return; const p = (y * w + x) * 4; d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = 255; };
  fn(put); // contorno oscuro alrededor de lo dibujado
  const a = new Uint8Array(w * h); for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { if (a[y * w + x]) continue; if ((x > 0 && a[y * w + x - 1]) || (x < w - 1 && a[y * w + x + 1]) || (y > 0 && a[(y - 1) * w + x]) || (y < h - 1 && a[(y + 1) * w + x])) { const p = (y * w + x) * 4; d[p] = 24; d[p + 1] = 22; d[p + 2] = 14; d[p + 3] = 255; } }
  g.putImageData(im, 0, 0); return c; }
const OBJ = {};
function blob(put, cx, cy, rx, ry, pal, seed, light = [-.6, -.8]) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
    const dx = (x - cx) / rx, dy = (y - cy) / ry, r = dx * dx + dy * dy, wob = (vnoise(x / 3, y / 3, seed) - .5) * .5; if (r > 1 + wob) continue;
    const l = -(dx * light[0] + dy * light[1]) * .5 + (vnoise(x / 2.2, y / 2.2, seed + 3) - .5) * .9;
    const ci = l > .45 ? 3 : l > .05 ? 2 : l > -.35 ? 1 : 0; put(x, y, pal[ci]); }
}
function buildObjects() {
  const G = ['#24461f', '#2f5e28', '#3f7a31', '#5e9c42'].map(hex), G2 = ['#2a3f1c', '#3b5726', '#527233', '#73934a'].map(hex), BR = ['#3a2614', '#5a3d22', '#7a5532'].map(hex);
  OBJ.arbol = [0, 1, 2].map(v => pxArt(72, 104, put => {
    for (let y = 62; y < 100; y++) for (let x = 33; x < 40; x++) put(x, y, BR[x < 35 ? 0 : x < 38 ? 1 : 2]);           // tronco
    for (const [bx, by] of [[30, 66], [44, 70]]) for (let k = 0; k < 8; k++) put(bx + (bx < 36 ? k : -k) * .6, by - k, BR[1]);  // ramas
    const pal = v === 2 ? G2 : G, s = v * 31;
    blob(put, 36, 46, 26, 20, pal, s + 1); blob(put, 24, 34, 17, 15, pal, s + 2); blob(put, 48, 32, 18, 15, pal, s + 3); blob(put, 36, 20, 19, 16, pal, s + 4);
    if (v === 1) blob(put, 36, 10, 11, 9, pal, s + 5);
  }));
  OBJ.arbusto = pxArt(40, 30, put => { blob(put, 20, 18, 16, 10, G, 77); for (let k = 0; k < 9; k++) { const x = 8 + hash(k, 1, 4) * 24, y = 11 + hash(k, 2, 4) * 12; put(x, y, [200, 40, 60]); put(x + 1, y, [230, 80, 90]); } });
  const ST = ['#4a4a50', '#6b6b72', '#8d8d94', '#b4b4bb'].map(hex);
  OBJ.piedra = pxArt(48, 34, put => { blob(put, 18, 22, 13, 10, ST, 11); blob(put, 32, 20, 11, 11, ST, 12); blob(put, 26, 13, 9, 7, ST, 13); });
  OBJ.oro = pxArt(48, 34, put => { blob(put, 18, 22, 13, 10, ST, 21); blob(put, 32, 20, 11, 11, ST, 22); blob(put, 26, 13, 9, 7, ST, 23);
    for (let k = 0; k < 16; k++) { const x = 8 + hash(k, 5, 6) * 32, y = 8 + hash(k, 6, 6) * 22; if (hash(k, 7, 6) > .3) { put(x, y, [255, 214, 64]); put(x + 1, y, [255, 240, 150]); put(x, y + 1, [190, 140, 30]); } } });
}
const OBJDEF = { arbol: { block: true, ay: 99, tree: true }, arbusto: { block: true, ay: 24 }, piedra: { block: true, ay: 28 }, oro: { block: true, ay: 28 } };

}

/* ---------------- ambiente: viento, hojas, peces, lluvia, nieve ---------------- */
let T = 0, weather = 0;   // 0 despejado, 1 lluvia, 2 nieve
const PART = [], DROPS = [];

function envUpdate(dt, vis) {
  // hojas secas que se desprenden de los árboles visibles
  if (vis.trees.length && Math.random() < dt * (1.2 + wind() * 2)) { const tr = vis.trees[(Math.random() * vis.trees.length) | 0];
    PART.push({ x: tr[0] + rnd(-18, 18), y: tr[1] - rnd(40, 80), vx: rnd(4, 12) * wind() + 6, vy: rnd(4, 10), ph: rnd(6.28), t: 0, life: rnd(3, 6), col: ['#c98a2c', '#d9b240', '#a4582a', '#7a9a3a'][(Math.random() * 4) | 0], gy: tr[1] + rnd(-4, 8) }); }
  for (let k = PART.length - 1; k >= 0; k--) { const p = PART[k]; p.t += dt; if (p.y < p.gy) { p.x += (p.vx + Math.sin(p.t * 3 + p.ph) * 8) * dt; p.y += p.vy * dt; } if (p.t > p.life) PART.splice(k, 1); }

  if (fish) { fish.t += dt; if (fish.t > .9) { splash(fish.x + fish.dir * 18, fish.y); fish = null; } }
  // lluvia y nieve (en coordenadas de pantalla)
  const want = weather === 1 ? Math.round(VW * VH / 900) : weather === 2 ? Math.round(VW * VH / 1600) : 0;
  while (DROPS.length < want) DROPS.push({ x: rnd(VW), y: rnd(-VH, VH), s: rnd(.6, 1.2), ph: rnd(6.28) });
  if (DROPS.length > want) DROPS.length = want;
  for (const d of DROPS) {
    if (weather === 1) { d.x += (40 * wind() + 20) * dt; d.y += 420 * d.s * dt; if (d.y > VH * (.5 + d.s * .5)) { if (Math.random() < .3) PART.push({ x: d.x + cam.x, y: d.y + cam.y, vx: 0, vy: 0, t: 0, life: .25, col: '#cfe6f5', gy: -1e9, ring: 1 }); d.y = rnd(-40, 0); d.x = rnd(VW); } }

    if (d.x > VW) d.x -= VW; }
}
