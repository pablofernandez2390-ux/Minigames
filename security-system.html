const FSRC={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101111011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111','.':'000000000000010',':':'000010000010000','+':'000010111010000','-':'000000111000000','!':'010010010000010','?':'111001011000010','/':'001001010100100','=':'000111000111000',',':'000000000010100','(':'001010010010001',')':'100010010010100','>':'100010001010100','<':'001010100010001','_':'000000000000111','%':'101001010100101','*':'000101010101000','#':'101111101111101'};

const textC=(str,cx,y,c,s,sh)=>text(str,Math.round(cx-tw(str,s||1)/2),y,c,s,sh);

function mk(rows,pal){const h=rows.length,w=rows[0].length,d=new Uint32Array(w*h);rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch])d[y*w+x]=pal[ch];}));return{w,h,data:d};}

function losBlock(tx,ty){const k=kindAt(tx,ty);if(k===0||k===5)return true;if(k===3)return !LVL.doorAt.get(ty*LVL.w+tx).open;if(k===4)return LVL.gateAt.get(ty*LVL.w+tx).closed;return false;}
function los(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)*4),tx1=Math.floor(x1),ty1=Math.floor(y1);
  for(let i=1;i<n;i++){const tx=Math.floor(x0+dx*i/n),ty=Math.floor(y0+dy*i/n);if(tx===tx1&&ty===ty1)return true;if(losBlock(tx,ty))return false;}return true;}

/* ================= SONIDO (chiptune) ================= */
const Snd=(()=>{
  let ac,master,ready=false,muted=false;
  function tone(f,type,vol,dur,delay,glide){if(!ready||muted)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}
  function noise(vol,dur,f,delay){if(!ready||muted)return;const t=ac.currentTime+(delay||0),n=ac.sampleRate*dur|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.8;const g=ac.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(master);s.start(t);}
  return{
    get muted(){return muted;},
    init(){if(ready){if(ac.state==='suspended')ac.resume();return;}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:.5;
      const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);ready=true;if(ac.state==='suspended')ac.resume();},
    setMute(m){muted=m;if(ready)master.gain.setTargetAtTime(m?0:.5,ac.currentTime,.02);},
    step(){noise(.05,.04,900);},
    key(){tone(880,'square',.05,.04);},
    nav(){tone(660,'square',.04,.03);},
    ok(){tone(784,'square',.07,.08);tone(1175,'square',.07,.12,.08);},
    error(){tone(150,'sawtooth',.12,.25,0,90);tone(120,'sawtooth',.12,.25,.12,80);},
    door(){noise(.12,.18,500);tone(220,'square',.05,.2,0,420);},
    hack(p){tone(500+p*900,'square',.035,.05);},
    pick(){[659,784,988,1318].forEach((f,i)=>tone(f,'square',.06,.09,i*.06));},
    detect(){tone(1400,'square',.09,.1);tone(1400,'square',.09,.1,.14);},
    siren(hi){tone(hi?880:620,'square',.07,.36);},
    beep(){tone(1000,'square',.06,.07);},
    lock(){noise(.25,.35,300);tone(90,'sawtooth',.12,.5,0,60);},
    warn(){[440,330,440,330].forEach((f,i)=>tone(f,'square',.08,.12,i*.14));},
    win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,'square',.07,.14,i*.1));},
    lose(){[330,311,294,262].forEach((f,i)=>tone(f,'sawtooth',.1,.3,i*.22));},
    escape(){[392,523,659,784].forEach((f,i)=>tone(f,'square',.07,.12,i*.09));},
    update(p){tone(300+p*500,'square',.03,.05);},
    save(){tone(988,'square',.06,.07);tone(1318,'square',.06,.1,.07);}
  };
})();

const IN={dx:0,dy:0,a:false,b:false};
const K={};let touchDir={x:0,y:0},touchA=false,touchB=false;
const ptrs=new Map();
let DP={x:0,y:0,r:34},BA={x:0,y:0,r:12},BB={x:0,y:0,r:12};
const NAV=[];let navHeld=null,navT=0,aEdge=false,bEdge=false,aPrev=false,bPrev=false,lastDir='0,0';
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();Snd.init();});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false;});
const toL=e=>({x:e.clientX*dpr/SC,y:e.clientY*dpr/SC});
function zoneAt(p){if(Math.hypot(p.x-DP.x,p.y-DP.y)<=DP.r+4)return'dpad';if(Math.hypot(p.x-BA.x,p.y-BA.y)<=BA.r+4)return'a';if(Math.hypot(p.x-BB.x,p.y-BB.y)<=BB.r+4)return'b';return null;}
function recalcTouch(){let dx=0,dy=0,a=false,b=false;
  for(const q of ptrs.values()){if(q.zone==='dpad'){const vx=q.p.x-DP.x,vy=q.p.y-DP.y,d=Math.hypot(vx,vy);if(d>5){if(Math.abs(vx)>d*.38)dx=vx>0?1:-1;if(Math.abs(vy)>d*.38)dy=vy>0?1:-1;}}else if(q.zone==='a')a=true;else if(q.zone==='b')b=true;}
  touchDir={x:dx,y:dy};touchA=a;touchB=b;}
cv.addEventListener('pointerdown',e=>{Snd.init();const p=toL(e),z=zoneAt(p);if(!z){if(S.state==='win'||S.state==='escaped'||S.state==='over'||S.state==='brief')aEdge=true;return;}ptrs.set(e.pointerId,{zone:z,p});try{cv.setPointerCapture(e.pointerId);}catch(_){}recalcTouch();});
cv.addEventListener('pointermove',e=>{const q=ptrs.get(e.pointerId);if(!q)return;q.p=toL(e);recalcTouch();});
const endP=e=>{ptrs.delete(e.pointerId);recalcTouch();};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
function readInput(dt){
  let dx=touchDir.x,dy=touchDir.y;
  if(K['arrowleft']||K['a'])dx=-1;if(K['arrowright']||K['d'])dx=1;if(K['arrowup']||K['w'])dy=-1;if(K['arrowdown']||K['s'])dy=1;
  IN.dx=dx;IN.dy=dy;
  const a=touchA||K['z']||K[' ']||K['enter'],b=touchB||K['x']||K['shift'];
  IN.a=a;IN.b=b;
  if(a&&!aPrev)aEdge=true;if(b&&!bPrev)bEdge=true;aPrev=a;bPrev=b;
  // eventos de navegación con repetición para la mini PC
  const key=dx+','+dy;
  if(key!==lastDir){lastDir=key;navHeld=null;navT=0;
    if(dy<0)NAV.push('u');else if(dy>0)NAV.push('d');else if(dx<0)NAV.push('l');else if(dx>0)NAV.push('r');
    if(dx||dy){navHeld=dy<0?'u':dy>0?'d':dx<0?'l':'r';navT=.38;}}
  else if(navHeld){navT-=dt;if(navT<=0){NAV.push(navHeld);navT=.09;}}
}

const S={state:'title',lv:0,t:0,toast:null,banner:null,alarm:{active:false,t:0},hack:null,pc:null,detT:0,lockInfo:null,fogKey:'',shake:0};

const toast=(msg,sec)=>{S.toast={msg,t:sec||2.4};};
const banner=(l1,l2,col,sec)=>{S.banner={l1,l2,col,t:sec||2.6};};

  if(!keepAlerts)LS[n].alerts=0;

const BRIEF=[
 ['ENTRA A LA SALA SECRETA DEL FONDO Y DESCARGA LOS SERVIDORES.','TU PENDRIVE (KEY V1) ABRE TODAS LAS PUERTAS.','LAS CAMARAS GIRAN: PASA CUANDO MIREN A OTRO LADO.'],

 ['EDIFICIO NUEVO, MAS CAMARAS Y MENOS TIEMPO.','NECESITAS 4 ACCESOS: 3 CLAVES Y 1 TARJETA PERDIDA.','UNA ALARMA MAS Y BLOQUEAN EL ALA DONDE ESTES.']
];

/* ================= LÓGICA ================= */
const accessOK=a=>PCS.cards.has(a)||PCS.saved.has(a);
function updateNeeds(){const nd=LV[S.lv].need;return nd?{to:nd.to,list:nd.access.map(a=>({a,ok:accessOK(a)}))}:null;}
function playerSec(){return secAt(LV[S.lv],Math.floor(P.x/TS),Math.floor(P.y/TS));}
function triggerAlarm(reason){
  if(S.alarm.active||(S.state!=='play'&&S.state!=='pc'))return;
  const ls=LS[S.lv];ls.alerts++;S.alarm={active:true,t:LV[S.lv].alarm,sirenT:0,sirenHi:false,lastBeep:99};
  if(S.state==='pc'){S.pc=null;S.state='play';}
  S.hack=null;
  if(ls.alerts>=3){const sec=playerSec();lockdown(sec);Snd.lock();banner('ALARMA 3/3','BLOQUEO DEL ALA: ESCAPA!',pk(255,70,60),3);}
  else if(ls.alerts===2){Snd.warn();banner('ALARMA 2/3','ULTIMA OPORTUNIDAD',pk(255,160,60),3);}
  else{Snd.detect();banner('ALARMA!',reason||'TE DETECTARON',pk(255,90,70),2.8);}
  toast('ESCAPA POR LAS ESCALERAS O TERMINA LA MISION',3);
}
function lockdown(sec){
  if(sec==='L'||sec==='M'&&LV[S.lv].gates.length===0)return;
  LVL.doors.forEach(d=>{if(d.sec===sec){d.sealed=true;d.open=false;}});
  LVL.gates.forEach(g=>{if(g.secs.includes(sec))g.closed=true;});
  S.lockInfo=sec;unstuck();
}
function unstuck(){const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);if(!solidAt(tx,ty))return;
  for(let r=1;r<4;r++)for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(!solidAt(tx+i,ty+j)){P.x=(tx+i+.5)*TS;P.y=(ty+j+.5)*TS;return;}}}
function openDoor(d,how){d.open=true;Snd.door();S.fogKey='';if(how)toast(how);}
function useDoor(d){
  if(d.sealed){toast('PUERTA BLOQUEADA');Snd.error();return;}
  if(d.method==='card'){if(PCS.cards.has(d.card))openDoor(d,'TARJETA '+d.card.toUpperCase()+' ACEPTADA');else{toast('REQUIERE TARJETA '+d.card.toUpperCase());Snd.error();}}
  else if(d.method==='pendrive'){S.hack={d,t:0,dur:1.25,last:0};}
  else if(d.method==='password'){if(d.card&&PCS.cards.has(d.card))openDoor(d,'TARJETA '+d.card.toUpperCase()+' ACEPTADA');else openPC('code',{kind:'door',door:d});}
}
function nearestDoor(){let best=null,bs=1e9;for(const d of LVL.doors){if(d.open)continue;const dx=(d.x+.5)*TS-P.x,dy=(d.y+.5)*TS-P.y,dist=Math.hypot(dx,dy);if(dist>1.75*TS)continue;const f=P.fx*dx+P.fy*dy,sc=dist-(f>0?3:0);if(sc<bs){bs=sc;best=d;}}return best;}
function nearestServer(){let best=null,bd=1e9;for(const s of LVL.servers){const d=Math.hypot((s.x+.5)*TS-P.x,(s.y+.5)*TS-P.y);if(d<1.7*TS&&d<bd){bd=d;best=s;}}return best;}
function openPC(scr,target){S.pc={scr:scr||'menu',sel:0,target:target||null,code:[0,0,0,0],pos:0,res:null,prog:0,msg:'',scroll:0,upd:false};if(scr==='code'){S.pc.code=[0,0,0,0];}S.state='pc';Snd.key();}
function closePC(){S.pc=null;S.state='play';}

/* movimiento */
function boxSolid(x,y,r){return solidAt(Math.floor((x-r)/TS),Math.floor((y-r)/TS))||solidAt(Math.floor((x+r)/TS),Math.floor((y-r)/TS))||solidAt(Math.floor((x-r)/TS),Math.floor((y+r)/TS))||solidAt(Math.floor((x+r)/TS),Math.floor((y+r)/TS));}
function movePlayer(dt){
  let dx=IN.dx,dy=IN.dy;P.moving=!!(dx||dy);if(!P.moving)return;
  const l=Math.hypot(dx,dy);dx/=l;dy/=l;const sp=(S.alarm.active?40:34)*dt;
  if(Math.abs(dx)>Math.abs(dy)){P.dir=dx>0?'right':'left';}else P.dir=dy>0?'down':'up';
  P.fx=Math.sign(IN.dx)||0;P.fy=Math.sign(IN.dy)||0;if(P.dir==='left'||P.dir==='right'){P.fx=P.dir==='right'?1:-1;P.fy=0;}else{P.fy=P.dir==='down'?1:-1;P.fx=0;}
  const r=2.6;
  let nx=P.x+dx*sp;if(!boxSolid(nx,P.y,r))P.x=nx;
  let ny=P.y+dy*sp;if(!boxSolid(P.x,ny,r))P.y=ny;
  P.anim+=dt*8;P.stepT-=dt;if(P.stepT<=0){Snd.step();P.stepT=.26;}
}
/* cámaras */
function camAngle(c){const spd=S.alarm.active?1.45:1;return c.base+c.amp*Math.sin(S.t*c.spd*spd+c.ph);}
function updateCams(dt){
  let seen=false;
  for(const c of LVL.cams){c.ang=camAngle(c);
    const cx=c.x+.5,cy=c.y+.5;c.vis.fill(0);
    const R=Math.ceil(c.range);
    for(let ty=Math.max(0,c.y-R);ty<=Math.min(LVL.h-1,c.y+R);ty++)for(let tx=Math.max(0,c.x-R);tx<=Math.min(LVL.w-1,c.x+R);tx++){
      if(LVL.g[ty*LVL.w+tx]===0)continue;if(los(cx,cy,tx+.5,ty+.5))c.vis[ty*LVL.w+tx]=1;}
    const px=P.x/TS,py=P.y/TS,dx=px-cx,dy=py-cy,dist=Math.hypot(dx,dy);
    let sees=false;
    if(dist<=c.range){let da=Math.atan2(dy,dx)-c.ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;if(Math.abs(da)<=c.half&&los(cx,cy,px,py))sees=true;}
    c.sees=sees;if(sees)seen=true;}
  if(seen){S.detT+=dt;if(S.detT>=.5&&!S.alarm.active)triggerAlarm('UNA CAMARA TE VIO');if(S.detT-dt<.01)Snd.detect();}else S.detT=Math.max(0,S.detT-dt*1.5);
  if(S.alarm.active)S.detT=Math.min(S.detT,.5);
}
function computeFog(){
  const key=Math.floor(P.x/TS)+','+Math.floor(P.y/TS)+','+LVL.doors.filter(d=>d.open).length+','+LVL.gates.filter(g=>g.closed).length;
  if(key===S.fogKey)return;S.fogKey=key;
  const v=LVL.vis;v.fill(0);const px=P.x/TS,py=P.y/TS,R=7.2;
  for(let ty=Math.floor(py-R);ty<=Math.ceil(py+R);ty++)for(let tx=Math.floor(px-R);tx<=Math.ceil(px+R);tx++){
    if(tx<0||ty<0||tx>=LVL.w||ty>=LVL.h)continue;const i=ty*LVL.w+tx;if(LVL.g[i]===0)continue;
    if(Math.hypot(tx+.5-px,ty+.5-py)>R)continue;if(los(px,py,tx+.5,ty+.5)){v[i]=1;LVL.seen[i]=1;}}
  for(let ty=0;ty<LVL.h;ty++)for(let tx=0;tx<LVL.w;tx++){const i=ty*LVL.w+tx;if(LVL.g[i]!==0||v[i])continue;
    let adj=false;for(let b=-1;b<=1&&!adj;b++)for(let a=-1;a<=1;a++){const nx=tx+a,ny=ty+b;if(nx<0||ny<0||nx>=LVL.w||ny>=LVL.h)continue;if(v[ny*LVL.w+nx]===1){adj=true;break;}}
    if(adj){v[i]=2;LVL.seen[i]=1;}}
}
/* pickups */
function updateItems(){for(const it of LVL.items){if(it.got)continue;if(Math.hypot((it.x+.5)*TS-P.x,(it.y+.5)*TS-P.y)<6){it.got=true;Snd.pick();
  if(it.t==='note'){PCS.notes.push(it.txt);toast('NOTA GUARDADA EN LA PC',2.6);}
  else{PCS.cards.add(it.kind);toast('TARJETA DE '+it.kind.toUpperCase()+' REGISTRADA EN LA PC',3);}}}}

/* ================= MINI PC ================= */
const MENU=['NOTAS','REGISTRO','PENDRIVE','CERRAR'];
function pcSubmit(){
  const pc=S.pc,code=pc.code.join(''),tg=pc.target;
  if(tg.kind==='door'){
    const d=tg.door;
    if(code===d.code){pc.res='ok';Snd.ok();PCS.log.push({label:d.label,code,ok:true,saved:false,access:d.access});pc.entry=PCS.log[PCS.log.length-1];openDoor(d);}
    else{pc.res='bad';Snd.error();d.attempts++;PCS.log.push({label:d.label,code,ok:false,saved:false});
      if(d.attempts>=3){d.attempts=0;pc.res='alarm';triggerAlarm('3 CLAVES FALLIDAS');}}
  }else if(tg.kind==='server'){
    if(code===LV[S.lv].serverCode){pc.res='dl';pc.prog=0;Snd.ok();}
    else{pc.res='bad';Snd.error();PCS.log.push({label:'SERVIDOR',code,ok:false,saved:false});}
  }
}
function updatePC(dt){
  const pc=S.pc;if(!pc)return;
  const nav=NAV.splice(0);const A=aEdge,B=bEdge;aEdge=false;bEdge=false;
  if(pc.scr==='menu'){
    for(const n of nav){if(n==='u'){pc.sel=(pc.sel+3)%4;Snd.nav();}else if(n==='d'){pc.sel=(pc.sel+1)%4;Snd.nav();}}
    if(B){closePC();return;}
    if(A){Snd.key();const s=MENU[pc.sel];if(s==='CERRAR'){closePC();return;}pc.scr=s==='NOTAS'?'notes':s==='REGISTRO'?'log':'pen';pc.sel=0;pc.scroll=0;pc.msg='';}
  }else if(pc.scr==='notes'){
    for(const n of nav){if(n==='u'&&pc.sel>0){pc.sel--;Snd.nav();}else if(n==='d'&&pc.sel<PCS.notes.length-1){pc.sel++;Snd.nav();}}
    if(B||A){pc.scr='menu';pc.sel=0;}
  }else if(pc.scr==='log'){
    for(const n of nav){if(n==='u'&&pc.sel>0){pc.sel--;Snd.nav();}else if(n==='d'&&pc.sel<PCS.log.length-1){pc.sel++;Snd.nav();}}
    if(A&&PCS.log[pc.sel]){const e=PCS.log[pc.sel];if(e.ok&&!e.saved&&e.access){e.saved=true;PCS.saved.add(e.access);pc.msg='CLAVE GUARDADA';Snd.save();}else if(e.ok&&e.saved)pc.msg='YA ESTABA GUARDADA';else pc.msg='NO SIRVIO: NO SE GUARDA';}
    if(B){pc.scr='menu';pc.sel=1;pc.msg='';}
  }else if(pc.scr==='pen'){
    const nd=updateNeeds(),pen=PCS.pen;
    if(A){if(pen>=LV[S.lv].pen&&(!nd||pen>=nd.to)){pc.msg='YA ESTA AL DIA';}
      else if(nd&&nd.list.every(x=>x.ok)&&pen<nd.to){pc.scr='upd';pc.prog=0;Snd.key();}
      else if(nd){pc.msg='FALTAN '+nd.list.filter(x=>!x.ok).length+' ACCESOS';Snd.error();}}
    if(B){pc.scr='menu';pc.sel=2;pc.msg='';}
  }else if(pc.scr==='upd'){
    pc.prog+=dt/2.6;if(Math.floor(pc.prog*14)!==Math.floor((pc.prog-dt/2.6)*14))Snd.update(pc.prog);
    if(pc.prog>=1){PCS.pen=LV[S.lv].need.to;Snd.win();pc.scr='updDone';}
  }else if(pc.scr==='updDone'){if(A||B){pc.scr='menu';pc.sel=2;}}
  else if(pc.scr==='code'){
    if(pc.res===null){
      for(const n of nav){if(n==='u'){pc.code[pc.pos]=(pc.code[pc.pos]+1)%10;Snd.key();}else if(n==='d'){pc.code[pc.pos]=(pc.code[pc.pos]+9)%10;Snd.key();}
        else if(n==='l'&&pc.pos>0){pc.pos--;Snd.nav();}else if(n==='r'&&pc.pos<3){pc.pos++;Snd.nav();}}
      if(A){if(pc.pos<3){pc.pos++;Snd.key();}else pcSubmit();}
      if(B){if(pc.pos>0){pc.pos--;Snd.nav();}else{closePC();return;}}
    }else if(pc.res==='ok'){
      if(A){if(pc.entry&&pc.entry.access){pc.entry.saved=true;PCS.saved.add(pc.entry.access);Snd.save();toast('CLAVE GUARDADA EN LA PC');}closePC();}
      else if(B){toast('SIN GUARDAR: LA PC NO LA TIENE');closePC();}
    }else if(pc.res==='bad'){
      if(A){pc.res=null;pc.pos=0;pc.code=[0,0,0,0];}else if(B){closePC();}
    }else if(pc.res==='alarm'){}
    else if(pc.res==='dl'){
      pc.prog+=dt/3;if(Math.floor(pc.prog*20)!==Math.floor((pc.prog-dt/3)*20))Snd.update(pc.prog);
      if(pc.prog>=1){S.pc=null;S.state='win';S.t=0;Snd.win();maxLevel=Math.max(maxLevel,S.lv+1);try{localStorage.setItem('ss.max',maxLevel);}catch(_){}}
    }
  }
}

/* ================= ACTUALIZACIÓN ================= */
function update(dt){
  readInput(dt);
  if(S.toast){S.toast.t-=dt;if(S.toast.t<=0)S.toast=null;}
  if(S.banner){S.banner.t-=dt;if(S.banner.t<=0)S.banner=null;}
  if(S.state==='title'||!LVL)return;
  S.t+=dt;
  if(S.state==='brief'){if(aEdge){aEdge=false;S.state='play';NAV.length=0;}return;}
  if(S.state==='win'||S.state==='escaped'||S.state==='over'){
    if(aEdge){aEdge=false;

      else if(S.state==='escaped')startLevel(S.lv,true);

    if(bEdge){bEdge=false;S.state='title';$('#start').classList.remove('hidden');buildLevelButtons();}
    return;}

    if(S.state==='play'){
      if(S.hack){const h=S.hack;h.t+=dt;if(Math.floor(h.t*10)!==h.last){h.last=Math.floor(h.t*10);Snd.hack(h.t/h.dur);}

      else{
        movePlayer(dt);

          if(sv&&(!d||Math.hypot((sv.x+.5)*TS-P.x,(sv.y+.5)*TS-P.y)<Math.hypot((d.x+.5)*TS-P.x,(d.y+.5)*TS-P.y)))openPC('code',{kind:'server'});

        if(bEdge){bEdge=false;openPC('menu');}
      }

    }else{updatePC(dt);}
    if(S.state==='play'||S.state==='pc'){
      computeFog();updateCams(dt);

      if(S.alarm.active){const al=S.alarm;al.t-=dt;al.sirenT-=dt;if(al.sirenT<=0){al.sirenT=.38;al.sirenHi=!al.sirenHi;Snd.siren(al.sirenHi);}

    }
  }
}

    PCS.log.slice(st,st+vis).forEach((e,i)=>{const idx=st+i,s=e.label.slice(0,10)+' '+e.code+(e.ok?(e.saved?' OK*':' OK'):' NO');item(i+1,s,pc.sel===idx);});
    if(pc.msg)text(pc.msg,sx0+3,sy0+sh-19,pk(255,210,63),1);
    text('A:GUARDAR B:VOLVER',sx0+3,sy0+sh-10,G2,1);
  }else if(pc.scr==='pen'){
    text('PENDRIVE KEY V'+PCS.pen,sx0+3,lineY(0),G1,1);const nd=updateNeeds();
    if(!nd)text('NIVEL SIN UPDATE',sx0+3,lineY(2),G2,1);
    else{text('PARA V'+nd.to+' NECESITAS:',sx0+3,lineY(1),G2,1);nd.list.forEach((a,i)=>{const how=PCS.cards.has(a.a)?'TARJETA':PCS.saved.has(a.a)?'CLAVE':'FALTA';text(a.a.toUpperCase().slice(0,9),sx0+3,lineY(2)+i*9,a.ok?G1:pk(255,120,100),1);text(how,sx0+sw-tw(how,1)-3,lineY(2)+i*9,a.ok?G1:pk(255,120,100),1);});
      const ready=nd.list.every(x=>x.ok)&&PCS.pen<nd.to;item(7,PCS.pen>=nd.to?'AL DIA':'ACTUALIZAR (A)',ready);}
    if(pc.msg)text(pc.msg,sx0+3,sy0+sh-19,pk(255,210,63),1);text('B: VOLVER',sx0+3,sy0+sh-10,G2,1);
  }else if(pc.scr==='upd'){
    textC('ACTUALIZANDO',sx0+sw/2,lineY(2),G1,1);textC('NO TE MUEVAS DE LA PC',sx0+sw/2,lineY(3)+2,G2,1);
    rect(sx0+6,lineY(5),sw-12,9,G2);rect(sx0+7,lineY(5)+1,sw-14,7,HI);rect(sx0+7,lineY(5)+1,Math.round((sw-14)*pc.prog),7,G1);textC(Math.round(pc.prog*100)+'%',sx0+sw/2,lineY(7),G1,1);
  }else if(pc.scr==='updDone'){
    textC('LISTO!',sx0+sw/2,lineY(2),G1,2);textC('PENDRIVE',sx0+sw/2,lineY(4),G1,1);textC('KEY V'+PCS.pen,sx0+sw/2,lineY(5),pk(60,230,220),2);textC('A: SEGUIR',sx0+sw/2,sy0+sh-10,G2,1);
  }else if(pc.scr==='code'){
    const tg=pc.target,name=tg.kind==='door'?tg.door.label:'SERVIDOR';
    textC(name,sx0+sw/2,lineY(0),G1,1);textC(tg.kind==='door'?'CLAVE DE 4 DIGITOS':'CODIGO DE ACCESO',sx0+sw/2,lineY(1),G2,1);
    if(pc.res===null||pc.res==='bad'||pc.res==='ok'||pc.res==='alarm'){
      for(let i=0;i<4;i++){const dx=sx0+8+i*19,dy=lineY(3)+2,sel=pc.pos===i&&pc.res===null;
        rect(dx,dy,15,22,sel?G1:pk(20,70,56));rect(dx+1,dy+1,13,20,sel?HI:pk(10,44,38));
        if(sel){for(let k=0;k<4;k++){put(dx+7-k,dy-2-k+3,G1);put(dx+7+k,dy-2-k+3,G1);put(dx+7-k,dy+26+k-3,G1);put(dx+7+k,dy+26+k-3,G1);}}
        text(String(pc.code[i]),dx+3,dy+4,sel?G1:pk(80,200,140),2);}
      if(pc.res===null){text('ARR/ABA: NUMERO',sx0+3,sy0+sh-38,G2,1);text('IZQ/DER: MOVER',sx0+3,sy0+sh-30,G2,1);text('A: SIGUE / OK',sx0+3,sy0+sh-22,G2,1);text('B: ATRAS / SALIR',sx0+3,sy0+sh-14,G2,1);}
      else if(pc.res==='ok'){textC('ACCESO CONCEDIDO',sx0+sw/2,sy0+sh-44,G1,1);text('A: GUARDAR CLAVE',sx0+3,sy0+sh-28,pk(255,210,63),1);text('B: NO GUARDAR',sx0+3,sy0+sh-18,G2,1);}
      else if(pc.res==='bad'){textC('CLAVE INCORRECTA',sx0+sw/2,sy0+sh-44,pk(255,110,90),1);if(tg.kind==='door')textC('INTENTO '+tg.door.attempts+'/3',sx0+sw/2,sy0+sh-34,pk(255,110,90),1);text('A: REINTENTAR',sx0+3,sy0+sh-24,G1,1);text('B: SALIR',sx0+3,sy0+sh-14,G2,1);}
      else textC('ALARMA!',sx0+sw/2,sy0+sh-34,pk(255,60,50),2);
    }
    if(pc.res==='dl'){
      rect(sx0+2,lineY(3)-2,sw-4,46,pk(8,34,30));textC('ACCESO CONCEDIDO',sx0+sw/2,lineY(3),G1,1);textC('DESCARGANDO DATOS',sx0+sw/2,lineY(4)+2,G1,1);
      rect(sx0+6,lineY(6),sw-12,9,G2);rect(sx0+7,lineY(6)+1,sw-14,7,HI);rect(sx0+7,lineY(6)+1,Math.round((sw-14)*pc.prog),7,G1);textC(Math.round(pc.prog*100)+'%',sx0+sw/2,lineY(8)+2,G1,1);}
  }
}
function render(){
  if(!buf)return;const tick=Math.floor(performance.now()/110);
  buf.fill(pk(8,10,24));
  if(LVL&&S.state!=='title'){
    drawWorld(tick);drawHud(tick);drawControls(tick);
    if(S.state==='pc')drawPC(tick);
    else if(S.state==='brief'){const b=BRIEF[S.lv],ls=[];b.forEach(t=>wrap(t,Math.floor((LW-26)/4)).forEach(l=>ls.push(l)));
      const al=LS[S.lv].alerts;if(al>0)ls.push('','ALERTA '+al+'/3'+(al===2?': ULTIMA OPORTUNIDAD':''));
      panel('NIVEL '+(S.lv+1),[LV[S.lv].name,'',...ls],'A: EMPEZAR',pk(125,255,176));}
    else if(S.state==='win')panel('MISION CUMPLIDA',['DATOS DESCARGADOS','',S.lv<LV.length-1?'EL SIGUIENTE EDIFICIO TE ESPERA':'COMPLETASTE LOS 3 EDIFICIOS'],S.lv<LV.length-1?'A: SIGUIENTE NIVEL':'A: MENU',pk(125,255,106));
    else if(S.state==='escaped')panel('ESCAPASTE',['SALISTE DEL EDIFICIO','ANTES DE QUE TE ATRAPEN','','ALERTA '+LS[S.lv].alerts+'/3'+(LS[S.lv].alerts>=2?' (EL SISTEMA TE RECUERDA)':'')],'A: REINTENTAR  B: MENU',pk(255,210,63));
    else if(S.state==='over')panel('GAME OVER',['TE ATRAPARON','','SE REINICIA EL NIVEL'],'A: OTRA VEZ  B: MENU',pk(255,70,60));
  }
  lctx.putImageData(limg,0,0);ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(lcv,0,0,LW,LH,0,0,LW*SC,LH*SC);
}

/* ================= INTERFAZ ================= */
function layout(){
  const VW=innerWidth,VH=innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);
  SC=Math.max(2,Math.floor(Math.min(cv.width/DW,cv.height/DH)));LW=Math.ceil(cv.width/SC);LH=Math.ceil(cv.height/SC);
  lcv=document.createElement('canvas');lcv.width=LW;lcv.height=LH;lctx=lcv.getContext('2d');limg=lctx.createImageData(LW,LH);buf=new Uint32Array(limg.data.buffer);
}
function buildLevelButtons(){
  const box=$('#lvs');box.innerHTML='';
  LV.forEach((l,i)=>{const b=document.createElement('button');b.className='lvb';b.disabled=i>maxLevel;b.innerHTML='NIVEL '+(i+1)+'<span>'+l.name.replace('EDIFICIO ','')+(i>maxLevel?' (BLOQUEADO)':'')+'</span>';
    b.addEventListener('click',()=>{Snd.init();try{const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f&&!document.fullscreenElement){const r=f.call(el);if(r&&r.catch)r.catch(()=>{});}}catch(_){}
      $('#start').classList.add('hidden');startLevel(i,false);});box.appendChild(b);});
}
$('#bSnd').addEventListener('click',()=>{Snd.init();Snd.setMute(!Snd.muted);$('#bSnd').classList.toggle('off',Snd.muted);});
addEventListener('resize',layout);
document.addEventListener('fullscreenchange',()=>setTimeout(layout,150));
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop);}
layout();buildLevelButtons();
requestAnimationFrame(loop);
})();
</script>
</body>
