<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f07">
<title>Liberación de Dados</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="coins.js"></script>
<style>
:root{--ink:#f3e7d3;--oro:#ffd23f;--pan:rgba(14,8,4,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a0f07;overflow:hidden;overscroll-behavior:none}
body{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;left:0;top:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:'Courier New',monospace;touch-action:manipulation}
/* marcador */
#top{position:fixed;left:0;right:0;top:0;z-index:5;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(to bottom,rgba(10,5,2,.96),rgba(10,5,2,.75) 80%,transparent)}
#score{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
body.many .pl{min-width:84px;font-size:10px;padding:2px 5px}
body.many .pl b{font-size:11px}
#score::-webkit-scrollbar{display:none}
.pl{flex:0 0 auto;min-width:92px;background:#2a1a0e;border:2px solid #4a3220;border-radius:8px;padding:3px 6px;font-size:11px;line-height:1.35;position:relative}
.pl.on{border-color:var(--oro);box-shadow:0 0 8px rgba(255,210,63,.45)}
.pl.out{opacity:.35}
.pl b{display:block;font-size:12px;white-space:nowrap}
.pl .h{color:#9fd3ff}.pl .r{color:#ff7a6a}.pl .s{color:#c7d2dc}.pl .o{color:var(--oro)}
.pl i{position:absolute;right:4px;top:3px;font-style:normal;font-size:10px;padding:0 4px;border-radius:4px;color:#1a1009}
#teams{text-align:center;font-size:11px;color:#cdb796;margin-top:3px}
#mesaRow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px;min-height:30px}
.chip{width:30px;height:30px;border-radius:6px;background:#efe3c8;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 0 #7a5a3a}
.chip img{width:24px;height:24px}
.chip.taken{opacity:.25}
.chip.hit{outline:3px solid var(--oro)}
/* panel de turno */
#bot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(10,5,2,.97),rgba(10,5,2,.8) 80%,transparent);display:flex;flex-direction:column;align-items:center;gap:6px}
#turnT{font-size:15px;color:var(--oro);text-shadow:2px 2px 0 #000}
#turnD{font-size:12px;font-weight:400;color:#d8c6aa;text-align:center;max-width:560px;min-height:16px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{font:900 15px 'Courier New',monospace;letter-spacing:.05em;color:#1a1009;background:var(--oro);border:0;border-radius:11px;padding:12px 22px;box-shadow:0 4px 0 #9a6f10;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6f10}
.btn:disabled{opacity:.35}
.btn.sec{background:#3a2614;color:var(--ink);box-shadow:0 4px 0 #160d05}
.btn.sm{font-size:12px;padding:9px 12px}
.step{display:flex;align-items:center;gap:4px;background:#2a1a0e;border-radius:11px;padding:3px}
.step button{width:38px;height:38px;border:0;border-radius:9px;background:#4a3220;color:var(--ink);font:900 20px monospace}
.step span{min-width:62px;text-align:center;font-size:13px}
#log{position:fixed;left:50%;transform:translateX(-50%);z-index:6;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 128px);width:min(94vw,520px);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
#log div{background:var(--pan);border:2px solid #6b4a2a;border-radius:9px;padding:5px 10px;font-size:13px;text-align:center;animation:inl .25s ease-out}
#log div.good{border-color:#5ab06a}#log div.bad{border-color:#d0503a}#log div.gold{border-color:var(--oro)}
@keyframes inl{from{transform:translateY(10px);opacity:0}}
#turnRow{display:flex;align-items:center;gap:10px}
#bGear{width:34px;height:30px;border-radius:8px;border:0;background:#3a2614;color:var(--ink);font-size:16px;cursor:pointer}
/* pantallas */
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(10,5,2,.78)}
.box{width:min(560px,96vw);max-height:94vh;overflow-y:auto;background:#24160b;border:3px solid #6b4a2a;border-radius:16px;padding:16px;touch-action:pan-y;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.logo{margin:0;text-align:center;font-size:clamp(22px,6vw,34px);letter-spacing:.06em;color:var(--oro);text-shadow:2px 2px 0 #000,4px 4px 0 #7a4a10;line-height:1.15}
.sub{text-align:center;font-size:12px;font-weight:400;color:#cdb796;margin:6px 0 12px}
.box h3{margin:12px 0 6px;font-size:13px;color:var(--oro);letter-spacing:.08em}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mode{background:#3a2614;border:2px solid #5a3e24;border-radius:10px;color:var(--ink);padding:9px 4px;font:900 14px 'Courier New',monospace;cursor:pointer}
.mode small{display:block;font-size:10px;font-weight:400;color:#cdb796;margin-top:2px}
.mode.on{border-color:var(--oro);background:#5a3a14}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.seat{display:flex;align-items:center;gap:6px;background:#2a1a0e;border-radius:9px;padding:5px 8px;font-size:12px}
.seat .dot{width:12px;height:12px;border-radius:50%}
.seat button{margin-left:auto;font:700 11px 'Courier New',monospace;background:#4a3220;color:var(--ink);border:0;border-radius:7px;padding:6px 8px;min-width:72px}
.seat button.cpu{background:#26394a}
.rules{font-size:12px;font-weight:400;color:#d8c6aa;line-height:1.5}
.rules b{color:var(--ink)}
.rules p{margin:5px 0}
.leg{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;margin:6px 0}
.leg img{width:26px;height:26px;background:#efe3c8;border-radius:5px;padding:1px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#rotate{display:none}
@media (max-height:500px){#turnD,#teams{display:none}#top{padding-top:max(3px,env(safe-area-inset-top))}.pl{font-size:10px;padding:1px 5px;line-height:1.2}.pl b{display:inline;font-size:11px;margin-right:4px}.pl br{display:none}#mesaRow{margin-top:2px;min-height:24px}.chip{width:24px;height:24px}.chip img{width:20px;height:20px}#bot{padding-top:4px;gap:4px;flex-direction:row;justify-content:center;flex-wrap:wrap}.btn{padding:9px 16px}.step button{width:32px;height:32px}#log{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 56px)}}
</style>
</head>
<body>
<canvas id="c3"></canvas>
<div id="top"><div id="score"></div><div id="teams"></div><div id="mesaRow"></div></div>
<div id="log"></div>
<div id="bot">
  <div id="turnRow"><div id="turnT">—</div><button id="bGear" aria-label="Menú">☰</button></div>
  <div id="turnD"></div>
  <div class="acts" id="acts">
    <button class="btn sec sm" id="bBuy">COMPRAR d6 · 50 oro</button>
    <div class="step"><button id="bMinus" aria-label="Menos dados">−</button><span id="nDice">1 dado</span><button id="bPlus" aria-label="Más dados">+</button></div>
    <button class="btn" id="bThrow">LANZAR</button>
  </div>
</div>
<div class="scr" id="menu">
  <div class="box">
    <h1 class="logo">LIBERACIÓN<br>DE DADOS</h1>
    <p class="sub">Liberá los dados de la mesa con tus propios d6</p>
    <h3>MODO</h3>
    <div class="modes" id="modes">
      <button class="mode" data-n="2" data-cpu="1">1 vs CPU<small>5 dados en mesa</small></button>
      <button class="mode" data-n="2">1 vs 1<small>5 dados en mesa</small></button>
      <button class="mode" data-n="4">2 vs 2<small>7 dados en mesa</small></button>
      <button class="mode" data-n="8">4 vs 4<small>11 dados en mesa</small></button>
    </div>
    <h3>JUGADORES <span style="font-weight:400;color:#cdb796;font-size:11px">· tocá para cambiar Humano / CPU · se juega pasando el teléfono</span></h3>
    <div class="seats" id="seats"></div>
    <div class="row"><button class="btn" id="bStart">EMPEZAR</button><button class="btn sec" id="bRules">REGLAS</button><a class="btn sec" href="index.html" style="text-decoration:none">SALIR</a></div>
  </div>
</div>
<div class="scr hidden" id="rules">
  <div class="box">
    <h1 class="logo" style="font-size:24px">REGLAS</h1>
    <div class="rules" id="rulesBody"></div>
    <div class="row"><button class="btn" id="bRulesOk">ENTENDIDO</button></div>
  </div>
</div>
<div class="scr hidden" id="pause">
  <div class="box" style="width:min(340px,94vw);text-align:center">
    <h1 class="logo" style="font-size:22px">PAUSA</h1>
    <div class="row" style="flex-direction:column;align-items:center">
      <button class="btn" data-p="seguir">SEGUIR</button>
      <button class="btn sec" data-p="reglas">REGLAS</button>
      <button class="btn sec" data-p="vel" id="bVel">VELOCIDAD CPU: NORMAL</button>
      <button class="btn sec" data-p="menu">NUEVA PARTIDA</button>
      <a class="btn sec" href="index.html" style="text-decoration:none">SALIR</a>
    </div>
  </div>
</div>
<div class="scr hidden" id="end">
  <div class="box" style="width:min(400px,94vw);text-align:center">
    <h1 class="logo" id="endT">¡LIBERACIÓN!</h1>
    <p class="sub" id="endD"></p>
    <div class="row"><button class="btn" id="bAgain">REVANCHA</button><button class="btn sec" id="bMenu">MENÚ</button></div>
  </div>
</div>
