<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a18">
<title>Dados Fight</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="coins.js"></script>
<style>
:root{--ink:#f3e7f3;--oro:#ffd23f;--cos:#9a7aff;--pan:rgba(14,8,20,.9)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120a18;overflow:hidden;overscroll-behavior:none}
body{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;left:0;top:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:'Courier New',monospace;touch-action:manipulation}
body.free .ui{display:none!important}
/* tarjetas de jugador */
.pc{position:fixed;left:50%;transform:translateX(-50%);z-index:5;width:min(96vw,460px);background:var(--pan);border:2px solid #3a2a50;border-radius:12px;padding:5px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px}
#p2{top:max(6px,env(safe-area-inset-top))}
.pc.on{border-color:var(--oro);box-shadow:0 0 10px rgba(255,210,63,.35)}
.pc b.nm{font-size:13px}
.bars{display:grid;grid-template-columns:18px 1fr 34px;gap:2px 5px;align-items:center;grid-column:1/4}
.bar{height:9px;background:#2a1a30;border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .3s}
.bar.hp i{background:linear-gradient(#ff7a6a,#c8302a)}
.bar.cos i{background:linear-gradient(#c8b0ff,#6a4ad8)}
.bars span{font-size:11px;text-align:right}
.res{display:flex;gap:10px;font-size:12px;justify-self:end}
.pc.hit{animation:hit .5s}
@keyframes hit{20%,60%{transform:translateX(calc(-50% - 6px));background:rgba(120,10,10,.9)}40%,80%{transform:translateX(calc(-50% + 6px))}}
#mesaRow{position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px}
.chip{width:30px;height:30px;border-radius:6px;background:#efe3c8;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #5a3a6a}
.chip img{width:24px;height:24px}
.chip.hit{outline:3px solid var(--oro)}
/* abajo: J1, mano y botón partido */
#bot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(to top,rgba(10,5,14,.97),rgba(10,5,14,.8) 80%,transparent)}
#bot .pc{position:static;transform:none}
#bot .pc.hit{animation:hit2 .5s}
@keyframes hit2{20%,60%{transform:translateX(-6px);background:rgba(120,10,10,.9)}40%,80%{transform:translateX(6px)}}
#turnT{font-size:13px;color:var(--oro);text-shadow:2px 2px 0 #000;min-height:16px;text-align:center}
#hand{display:flex;gap:6px;overflow-x:auto;max-width:96vw;padding:4px 2px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#hand::-webkit-scrollbar{display:none}
.hd{flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:#b8261a;box-shadow:0 3px 0 #5a120c;position:relative;cursor:pointer}
.hd.sel{outline:3px solid var(--oro);transform:translateY(-3px)}
.hd svg{width:100%;height:100%}
.hd.p2{background:#1f4f9a;box-shadow:0 3px 0 #0c2a5a}
.acts{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.split{display:flex;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 #6a4a10}
.split button{border:0;font:900 14px 'Courier New',monospace;padding:12px 14px;cursor:pointer;letter-spacing:.03em}
.split #bNum{background:var(--oro);color:#1a1009;border-right:3px solid #1a1009}
.split #bSym{background:#e8c46a;color:#1a1009;display:flex;align-items:center;gap:6px}
.split #bSym img{width:22px;height:22px}
.split button:disabled{opacity:.4}
.split small{display:block;font-size:10px;font-weight:400}
.btn{font:900 14px 'Courier New',monospace;color:#1a1009;background:var(--oro);border:0;border-radius:11px;padding:11px 18px;box-shadow:0 4px 0 #9a6f10;cursor:pointer}
.btn.sec{background:#3a2a4a;color:var(--ink);box-shadow:0 4px 0 #1a0f22}
.btn.sm{font-size:11px;padding:8px 10px}
.btn:disabled{opacity:.35}
#tools{position:fixed;right:max(8px,env(safe-area-inset-right));z-index:9;display:flex;flex-direction:column;gap:6px}
#tools button{width:38px;height:38px;border-radius:10px;border:0;background:rgba(40,25,55,.9);color:var(--ink);font-size:17px}
#log{position:fixed;left:50%;transform:translateX(-50%);z-index:6;width:min(94vw,500px);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
#log div{background:var(--pan);border:2px solid #4a3a60;border-radius:9px;padding:5px 10px;font-size:13px;text-align:center;animation:inl .25s ease-out}
#log div.good{border-color:#5ab06a}#log div.bad{border-color:#d0503a}#log div.gold{border-color:var(--oro)}#log div.cos{border-color:var(--cos)}
@keyframes inl{from{transform:translateY(10px);opacity:0}}
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(10,5,14,.8)}
.box{width:min(560px,96vw);max-height:94vh;overflow-y:auto;background:#1e1228;border:3px solid #5a3a7a;border-radius:16px;padding:16px;touch-action:pan-y;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.logo{margin:0;text-align:center;font-size:clamp(24px,7vw,38px);letter-spacing:.06em;color:var(--oro);text-shadow:2px 2px 0 #000,4px 4px 0 #6a2ad8;line-height:1.15}
.sub{text-align:center;font-size:12px;font-weight:400;color:#cbb8de;margin:6px 0 12px}
.box h3{margin:12px 0 6px;font-size:13px;color:var(--oro);letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seg button{font:700 13px "Courier New",monospace;background:#3a2a4a;color:var(--ink);border:2px solid #5a3a7a;border-radius:9px;padding:9px 12px}
.seg button.on{border-color:var(--oro);background:#5a3a2a}
.rules{font-size:12px;font-weight:400;color:#ddd0ea;line-height:1.5}
.rules b{color:var(--ink)}
.rules p{margin:5px 0}
.leg{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;margin:6px 0}
.leg img{width:26px;height:26px;background:#efe3c8;border-radius:5px;padding:1px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#ab .box{width:min(380px,94vw);text-align:center;border-color:var(--cos)}
#abT{font-size:18px;color:var(--cos);margin:0 0 6px}
#abD{font-size:14px;font-weight:400;color:var(--ink);line-height:1.45}
#abD b{color:var(--oro)}
@media (max-height:520px) and (orientation:landscape){#bot{display:grid;grid-template-columns:250px minmax(0,auto);justify-content:center;align-items:center;column-gap:14px;row-gap:3px}#bot .pc{grid-column:1;grid-row:1/4;width:250px}#turnT,#hand,#acts{grid-column:2}#turnT{font-size:11px;min-height:0}#hand{max-width:46vw}.pc{width:min(60vw,360px)}}
@media (max-height:520px){.pc{padding:3px 7px;font-size:11px}.bar{height:7px}#hand .hd{width:34px;height:34px}.split button{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c3"></canvas>
<div class="pc ui" id="p2"></div>
<div id="mesaRow" class="ui"></div>
<div id="log" class="ui"></div>
<div id="tools"><button id="bEye" aria-label="Ocultar paneles">👁</button><button id="bGear" class="ui" aria-label="Menú">☰</button></div>
<div id="bot" class="ui">
  <div id="turnT">—</div>
  <div id="hand"></div>
  <div class="acts" id="acts">
    <button class="btn sec sm" id="bBuy">COMPRAR d6<br>50 oro</button>
    <div class="split"><button id="bNum">LANZAR<small id="nNum">1 dado</small></button><button id="bSym"><img id="symImg" alt=""><span>SÍMBOLOS</span></button></div>
  </div>
  <div class="pc" id="p1"></div>
</div>

<div class="scr" id="menu">
  <div class="box">
    <h1 class="logo">DADOS<br>FIGHT</h1>
    <p class="sub">Duelo 1 contra 1 · juntá cosmo y desatá habilidades</p>
    <h3>RIVAL</h3>
    <div class="seg" id="vs"><button data-v="cpu" class="on">CONTRA LA CPU</button><button data-v="hum">2 JUGADORES</button></div>
    <div class="row"><button class="btn" id="bStart">PELEAR</button><button class="btn sec" id="bRules">REGLAS</button><a class="btn sec" href="index.html" style="text-decoration:none">SALIR</a></div>
  </div>
</div>
<div class="scr hidden" id="rules"><div class="box"><h1 class="logo" style="font-size:24px">REGLAS</h1><div class="rules" id="rulesBody"></div><div class="row"><button class="btn" id="bRulesOk">ENTENDIDO</button></div></div></div>
<div class="scr hidden" id="ab"><div class="box"><h2 id="abT">HABILIDAD</h2><div id="abD"></div><div class="row"><button class="btn" id="abYes">USAR</button><button class="btn sec" id="abNo">NO</button></div></div></div>
<div class="scr hidden" id="pause">
  <div class="box" style="width:min(340px,94vw);text-align:center">
    <h1 class="logo" style="font-size:22px">PAUSA</h1>
    <div class="row" style="flex-direction:column;align-items:center">
      <button class="btn" data-p="seguir">SEGUIR</button>
      <button class="btn sec" data-p="reglas">REGLAS</button>
      <button class="btn sec" data-p="vel" id="bVel">VELOCIDAD CPU: NORMAL</button>
      <button class="btn sec" data-p="menu">NUEVO DUELO</button>
      <a class="btn sec" href="index.html" style="text-decoration:none">SALIR</a>
    </div>
  </div>
</div>
<div class="scr hidden" id="end"><div class="box" style="width:min(380px,94vw);text-align:center"><h1 class="logo" id="endT">K.O.</h1><p class="sub" id="endD"></p><div class="row"><button class="btn" id="bAgain">REVANCHA</button><button class="btn sec" id="bMenu">MENÚ</button></div></div></div>
