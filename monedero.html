<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c120a">
<title>Monedero</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="coins.js"></script>
<style>
:root{--ink:#f3e7d3;--oro:#ffd23f;--pan:rgba(26,16,9,.88)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c120a;overflow:hidden;overscroll-behavior:none}
body{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;left:0;top:0;display:block;touch-action:none}
.hidden{display:none!important}
#top{position:fixed;left:0;right:0;top:0;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));text-align:center;z-index:5;background:linear-gradient(to bottom,rgba(10,5,2,.95),rgba(10,5,2,.55) 75%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
#top h1{margin:0;font-size:22px;letter-spacing:.1em;color:var(--oro);text-shadow:2px 2px 0 #000,4px 4px 0 #7a4a10}
#tot{font-size:30px;color:#fff3a0;text-shadow:2px 2px 0 #000;margin-top:2px}
#legend{font-size:12px;font-weight:400;color:#d8c6aa}
#legend .o{color:#ffcf3a}#legend .p{color:#dfe5ea}#legend .c{color:#e08a50}
#back{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));color:#d8c6aa;text-decoration:none;font-size:22px;padding:2px 8px}
#bMotion{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:12px;border:2px solid #5a3d22;background:var(--pan);color:var(--ink);font-size:20px}
#bMotion.on{background:var(--oro);color:#1a1009;border-color:#9a6f10}
#empty{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;text-align:center;font-size:13px;color:#e8dcc6;background:rgba(14,8,4,.75);padding:8px 14px;border-radius:10px;pointer-events:none}
#cap{position:fixed;left:50%;top:150px;transform:translateX(-50%);z-index:4;font-size:11px;color:#d8c6aa;pointer-events:none}
#bot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5;background:linear-gradient(to top,rgba(10,5,2,.95),rgba(10,5,2,.55) 75%,transparent)}
.row{display:flex;gap:10px}
.btn{font:900 15px 'Courier New',monospace;color:#1a1009;background:var(--oro);border:0;border-radius:12px;padding:12px 16px;box-shadow:0 4px 0 #9a6f10;cursor:pointer}
.btn.sec{background:#3a2614;color:var(--ink);box-shadow:0 4px 0 #160d05}
.btn:disabled{opacity:.4}
#hint{font-size:11px;font-weight:400;color:#cdb796;text-align:center;transition:opacity .4s}
#hint.dim{opacity:.35}
</style>
</head>

<canvas id="c3"></canvas>
<div id="top"><a id="back" href="index.html" aria-label="Volver">&larr;</a><h1>MONEDERO</h1><div id="tot">🪙 <span id="bal">0</span></div><div id="legend"></div><button id="bMotion" type="button" aria-label="Agitar con el teléfono">📳</button></div>

<div id="cap" class="hidden">Se muestran hasta 60 monedas de oro</div>
