<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f07">
<title>Tirada Diaria</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="coins.js"></script>
<style>
:root{--ink:#f3e7d3;--oro:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a0f07;overflow:hidden;overscroll-behavior:none}
body{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;left:0;top:0;display:block;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
.hidden{display:none!important}
#top{position:fixed;left:0;right:0;top:0;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));text-align:center;z-index:5;background:linear-gradient(to bottom,rgba(10,5,2,.95),rgba(10,5,2,.6) 75%,transparent)}
#top h1{margin:0;font-size:24px;letter-spacing:.08em;color:var(--oro);text-shadow:2px 2px 0 #000,4px 4px 0 #7a4a10}
#top p{margin:4px 0 0;font-size:12px;font-weight:400;color:#d8c6aa}
#coins{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top));background:#1b1714;color:var(--oro);padding:4px 9px;font-size:14px;box-shadow:0 0 0 2px #a63d2f}
#back{position:absolute;left:12px;top:max(10px,env(safe-area-inset-top));color:#d8c6aa;text-decoration:none;font-size:20px;padding:2px 8px}
#bot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;background:linear-gradient(to top,rgba(10,5,2,.95),rgba(10,5,2,.6) 75%,transparent)}
#hand{display:flex;gap:6px;transition:.3s}
#hand.gone{opacity:0;transform:translateY(20px)}
.mini{width:44px;height:44px;animation:flo 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 3px rgba(0,0,0,.5))}
.mini:nth-child(2){animation-delay:-.4s}.mini:nth-child(3){animation-delay:-.8s}.mini:nth-child(4){animation-delay:-1.2s}.mini:nth-child(5){animation-delay:-1.6s}

#throw{font:900 17px 'Courier New',monospace;letter-spacing:.08em;color:#1a1009;background:var(--oro);border:0;border-radius:12px;padding:14px 34px;box-shadow:0 4px 0 #9a6f10;cursor:pointer}
#throw:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6f10}
#throw:disabled{opacity:.35}
#hint{font-size:12px;font-weight:400;color:#cdb796;text-align:center;max-width:340px}
#win{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,360px);z-index:7;text-align:center;background:rgba(14,8,4,.9);border:3px solid var(--oro);border-radius:16px;padding:18px 26px;box-shadow:0 0 40px rgba(255,210,63,.35);animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) translateY(40px) scale(.8);opacity:0}}
#winN{font-size:48px;color:var(--oro);text-shadow:3px 3px 0 #000,6px 6px 0 #7a4a10;line-height:1}
#winD{font-size:13px;color:#d8c6aa;margin:8px 0 12px}
#win a,#lock a{display:inline-block;font:700 14px 'Courier New',monospace;color:#1a1009;background:var(--oro);text-decoration:none;padding:10px 16px;border-radius:10px;box-shadow:0 4px 0 #9a6f10;margin:4px}
#win a.sec,#lock a.sec{background:#3a2614;color:var(--ink);box-shadow:0 4px 0 #160d05}
#lock{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:7;text-align:center;background:rgba(14,8,4,.92);border:2px solid #6b4a2a;border-radius:14px;padding:18px 22px;max-width:320px}
#lock b{color:var(--oro);font-size:18px}
#lock p{font-size:13px;font-weight:400;color:#d8c6aa}
</style>
</head>
