<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1a24">
<title>Mundo de Cubos</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1a24;overflow:hidden;overscroll-behavior:none}
body{font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:#eef;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;left:0;top:0;display:block;touch-action:none}
.hidden{display:none!important}
#top{position:fixed;left:0;right:0;top:0;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.box{background:rgba(10,16,22,.7);border:2px solid #34495a;border-radius:10px;padding:5px 10px;font-size:13px;color:#dfe8ef;text-decoration:none;white-space:nowrap}
#bNew{margin-left:auto;font:700 12px 'Courier New',monospace;cursor:pointer}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:10px;top:0;width:2px;height:22px}
#cross:after{left:0;top:10px;width:22px;height:2px}
#bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:5;text-align:center}
#selName{font-size:12px;color:#fff;text-shadow:1px 1px 0 #000;min-height:16px;margin-bottom:3px}
#hotbar{display:flex;gap:2px;background:rgba(0,0,0,.5);padding:3px;border-radius:6px}
.slot{width:38px;height:38px;border:2px solid #555;background:rgba(40,40,40,.6);position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.slot img{width:30px;height:30px;image-rendering:pixelated}
.slot b{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);z-index:6;pointer-events:none;opacity:0}
#joy.on{opacity:1}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
#bJump{position:fixed;right:18px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 70px));width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:26px;z-index:6;display:none}
body.touch #bJump{display:block}
#loading{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1a24;gap:10px}
#loading h1{margin:0;font-size:32px;color:#8fd14f;text-shadow:3px 3px 0 #000,6px 6px 0 #2d5a14;letter-spacing:.06em;text-align:center}
#loading p{margin:0;font-size:12px;font-weight:400;color:#9fb3c2;max-width:340px;text-align:center;line-height:1.5}
#loadP{font-size:20px;color:#fff}
#toast{position:fixed;left:50%;top:60px;transform:translate(-50%,-10px);background:rgba(10,16,22,.92);border:2px solid #34495a;border-radius:10px;padding:7px 14px;font-size:14px;color:#ffd23f;opacity:0;transition:.2s;z-index:30;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="c3"></canvas>
<div id="cross"></div>
<div id="top">
  <a class="box" href="index.html">‹</a>
  <span class="box" id="clock">06:00</span>
  <button class="box" id="bNew">Mundo nuevo</button>
</div>
<div id="bar"><div id="selName"></div><div id="hotbar"></div></div>
<div id="joy"><div id="knob"></div></div>
<button id="bJump">⤒</button>
<div id="toast"></div>
<div id="loading">
  <h1>MUNDO<br>DE CUBOS</h1>
  <div id="loadP">0%</div>
  <p>Táctil: joystick a la izquierda, arrastrá a la derecha para mirar. Tocá para poner, mantené para picar.<br>PC: WASD, espacio, clic izq. picar, clic der. poner, 1-9 bloques.</p>
</div>
